# Bump BOTH values for every release. versionCode must always increase or Android refuses the update.
VERSION_CODE=240
VERSION_NAME=2.4.0
# HTTPS manifest the app checks for updates (can also be changed inside the app: More → App updates).
# HEAD = the repository's default branch, so this keeps working if the default branch is renamed.
UPDATE_URL=https://raw.githubusercontent.com/tharun1343/Field_ledger_Surya/HEAD/release/version.json
# Public base URL where the APK files are published (written into version.json as apkUrl).
RELEASE_BASE_URL=https://raw.githubusercontent.com/tharun1343/Field_ledger_Surya/HEAD/release
