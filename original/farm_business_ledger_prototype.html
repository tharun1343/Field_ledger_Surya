<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#6d45d9" />
<title>FieldLedger — Farm Business Tracker</title>
<style>
  :root {
    --bg: #f5f5fb; --surface: #ffffff; --surface-2: #f8f7fc; --text: #201d2b; --muted: #777386;
    --line: #e8e5ef; --primary: #7248df; --primary-2: #a18af4; --primary-soft: #f0eaff;
    --positive: #16885a; --negative: #d64c4c; --yellow: #d99a18; --shadow: 0 12px 36px rgba(35, 24, 76, .08);

  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.45; transition: background .2s, color .2s; }
  body[data-product="muskmelon"] { --primary: #c58b12; --primary-2: #f1ca63; --primary-soft: #fff5d5; }
  body[data-theme="dark"] { --bg: #111018; --surface: #1c1a26; --surface-2: #242130; --text: #f2effb; --muted: #aaa5bb; --line: #353142; --primary-soft: #302745; --shadow: 0 12px 36px rgba(0,0,0,.22); }
  body[data-theme="dark"][data-product="muskmelon"] { --primary-soft: #382e1b; }
  body.text-small { font-size: 12px; } body.text-large { font-size: 16px; }
  button, input, select { font: inherit; } button { cursor: pointer; }
  .app-shell { max-width: 1440px; margin: auto; padding: 18px clamp(12px, 2.5vw, 34px) 38px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px; }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .brand-mark { width:48px; height:48px; border-radius:17px; display:grid; place-items:center; font-size:25px; background:linear-gradient(145deg,var(--primary-2),var(--primary)); box-shadow:inset 0 2px 2px #ffffff99, 0 7px 13px color-mix(in srgb, var(--primary) 25%, transparent); transform:rotate(-3deg); }
  .brand-title { font-size:18px; font-weight:850; letter-spacing:-.5px; line-height:1.15; }
  .brand-sub { color:var(--muted); font-size:12px; margin-top:4px; }
  .top-actions { display:flex; align-items:center; gap:8px; }
  .icon-btn, .profile-chip { border:1px solid var(--line); color:var(--text); background:var(--surface); border-radius:14px; min-height:42px; padding:0 12px; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 3px 9px rgba(25,20,50,.025); }
  .icon-btn { width:42px; font-size:17px; padding:0; }
  .profile-chip { font-weight:700; }
  .avatar { width:25px; height:25px; display:grid; place-items:center; border-radius:9px; color:white; background:linear-gradient(145deg,#a891f7,#5e35cb); font-size:12px; }
  .product-switch { display:flex; align-items:center; gap:8px; padding:6px; width:max-content; max-width:100%; border-radius:18px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); margin-bottom:16px; }
  .product-tab { display:flex; align-items:center; gap:9px; border:0; color:var(--muted); background:transparent; padding:10px 17px; border-radius:13px; font-weight:800; white-space:nowrap; }
  .product-tab .mini-icon { width:30px; height:30px; display:grid; place-items:center; font-size:17px; border-radius:10px; background:var(--surface-2); box-shadow:inset 0 1px #ffffff66; }
  .product-tab.active { color:var(--primary); background:var(--primary-soft); box-shadow:inset 0 1px 0 #ffffff8c; }
  .context-row { display:flex; justify-content:space-between; align-items:end; gap:12px; margin:16px 2px 18px; }
  .eyebrow { color:var(--primary); text-transform:uppercase; font-weight:850; letter-spacing:1.5px; font-size:10px; }
  h1 { margin:3px 0 0; font-size:clamp(25px,3.3vw,34px); letter-spacing:-1.1px; line-height:1.12; }
  h2 { margin:0; font-size:17px; letter-spacing:-.35px; } h3 { margin:0; font-size:14px; }
  p { margin:0; } .muted { color:var(--muted); } .small { font-size:12px; } .mono { font-variant-numeric:tabular-nums; }
  .context-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { border:1px solid var(--line); color:var(--text); background:var(--surface); border-radius:13px; padding:10px 14px; font-weight:750; transition:transform .15s, box-shadow .15s, background .15s; }
  .btn:hover { transform:translateY(-1px); box-shadow:0 7px 18px rgba(30,20,60,.08); }
  .btn.primary { background:linear-gradient(135deg,var(--primary-2),var(--primary)); color:white; border-color:transparent; box-shadow:0 6px 14px color-mix(in srgb, var(--primary) 23%, transparent), inset 0 1px 0 #ffffff75; }
  .btn.soft { color:var(--primary); background:var(--primary-soft); border-color:transparent; }
  .btn.danger { color:var(--negative); background:color-mix(in srgb, var(--negative) 8%, var(--surface)); }
  .btn.small-btn { padding:7px 10px; border-radius:10px; font-size:12px; }
  .nav { display:flex; gap:5px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; margin:0 0 20px; }
  .nav::-webkit-scrollbar { display:none; }
  .nav-btn { border:0; background:transparent; color:var(--muted); border-bottom:3px solid transparent; padding:12px 15px 13px; white-space:nowrap; font-weight:750; display:flex; align-items:center; gap:8px; }
  .nav-btn .nav-emoji { font-size:16px; filter:drop-shadow(0 2px 1px #00000014); }
  .nav-btn.active { border-bottom-color:var(--primary); color:var(--primary); }
  .view { min-height:330px; }
  .grid { display:grid; gap:15px; } .grid.kpis { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .grid.two { grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr); }
  .grid.equal { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .card { min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
  .card-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:15px; }
  .kpi { position:relative; overflow:hidden; padding:17px; }
  .kpi::after { content:""; position:absolute; width:95px; height:95px; border-radius:50%; right:-40px; bottom:-45px; background:var(--primary-soft); opacity:.9; }
  .kpi-top { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); font-weight:700; font-size:12px; position:relative; z-index:1; }
  .kpi-icon { width:36px; height:36px; border-radius:13px; display:grid; place-items:center; font-size:18px; background:var(--primary-soft); box-shadow:inset 0 1px 1px #ffffff8c, 0 4px 8px color-mix(in srgb, var(--primary) 10%, transparent); }
  .kpi-value { font-size:clamp(20px,2.1vw,28px); font-weight:850; letter-spacing:-.8px; margin-top:15px; position:relative; z-index:1; }
  .kpi-note { margin-top:3px; color:var(--muted); font-size:11px; position:relative; z-index:1; }
  .section-gap { margin-top:16px; }
  .quick-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
  .quick-card { text-align:left; display:flex; align-items:center; gap:11px; min-height:78px; padding:14px; border:1px solid var(--line); border-radius:17px; background:var(--surface-2); color:var(--text); }
  .quick-card:hover { border-color:var(--primary-2); transform:translateY(-1px); }
  .quick-icon { flex-shrink:0; height:42px; width:42px; display:grid; place-items:center; border-radius:14px; font-size:21px; background:linear-gradient(145deg,var(--primary-soft),var(--surface)); box-shadow:inset 0 1px #ffffffa6, 0 5px 10px rgba(25,20,50,.05); }
  .quick-card strong { display:block; font-size:12px; } .quick-card span { color:var(--muted); font-size:11px; display:block; margin-top:3px; }
  .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:14px; }
  table { width:100%; border-collapse:separate; border-spacing:0; min-width:650px; font-size:12px; }
  thead th { background:var(--surface-2); color:var(--muted); text-align:left; text-transform:uppercase; letter-spacing:.65px; font-size:10px; padding:12px 13px; white-space:nowrap; border-bottom:1px solid var(--line); }
  tbody td { padding:12px 13px; border-bottom:1px solid var(--line); white-space:nowrap; } tbody tr:last-child td { border-bottom:0; }
  tbody tr:hover { background:color-mix(in srgb,var(--primary-soft) 34%,transparent); }
  tfoot td { background:var(--surface-2); padding:12px 13px; font-weight:850; border-top:1px solid var(--line); white-space:nowrap; }
  .tag { display:inline-flex; align-items:center; gap:5px; color:var(--primary); background:var(--primary-soft); border-radius:8px; padding:5px 8px; font-size:10px; font-weight:850; }
  .positive { color:var(--positive); font-weight:800; } .negative { color:var(--negative); font-weight:800; }
  .chart { height:190px; display:flex; align-items:end; gap:9px; padding:18px 4px 0; border-bottom:1px solid var(--line); }
  .bar-col { flex:1; height:100%; display:flex; flex-direction:column; justify-content:end; align-items:center; min-width:0; gap:8px; }
  .bar { width:min(100%,40px); min-height:4px; border-radius:10px 10px 3px 3px; background:linear-gradient(180deg,var(--primary-2),var(--primary)); box-shadow:inset 0 1px #ffffff85; }
  .bar-label { font-size:10px; color:var(--muted); white-space:nowrap; }
  .bar-value { font-size:9px; color:var(--muted); }
  .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px; }
  .field { display:flex; flex-direction:column; gap:7px; min-width:0; }
  .field.full { grid-column:1/-1; }
  .field label, .field-label { color:var(--muted); font-size:12px; font-weight:750; }
  input, select { width:100%; color:var(--text); background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px 13px; outline:none; min-height:44px; }
  input:focus, select:focus { border-color:var(--primary); box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent); }
  input[readonly] { opacity:.8; }
  .field-hint { color:var(--muted); font-size:11px; margin-top:-2px; }
  .form-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:18px; padding-top:17px; border-top:1px solid var(--line); }
  .calc-strip { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); align-items:stretch; gap:10px; margin-top:16px; }
  .calc-strip.three-col { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .calc-item { min-width:0; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:0 5px 16px rgba(35,24,76,.045); transition:transform .2s, border-color .2s; }
  .calc-item:hover { transform:translateY(-2px); border-color:color-mix(in srgb,var(--primary) 32%,var(--line)); }
  .calc-item span { display:block; color:var(--muted); font-size:11px; font-weight:750; }
  .calc-item strong { font-size:clamp(16px,1.7vw,21px); display:block; margin-top:6px; color:var(--primary); overflow-wrap:anywhere; }
  .calc-item.sale strong { color:#16885a; } .calc-item.expense strong { color:#d64c4c; } .calc-item.labour strong { color:#8b50c7; } .calc-item.net strong { color:var(--primary); }
  .detail-edit { width:100%; text-align:left; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; margin-top:8px; color:var(--text); background:var(--surface-2); border:1px solid var(--line); border-radius:13px; transition:background .2s,border-color .2s,transform .2s; }
  .detail-edit:hover { border-color:var(--primary-2); transform:translateY(-1px); }
  .detail-edit strong { color:var(--primary); }
  .bag-preview { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .bag-chip { display:inline-flex; align-items:center; gap:5px; padding:5px 8px; border:1px solid var(--line); border-radius:9px; color:var(--muted); background:var(--surface); font-size:11px; }
  .modal-layer { position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:18px; background:rgba(17,14,28,.56); backdrop-filter:blur(8px); animation:fadeIn .18s ease both; }
  .modal-panel { width:min(760px,100%); max-height:min(88dvh,920px); overflow:auto; background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:24px; box-shadow:0 28px 90px rgba(0,0,0,.28); animation:modalIn .24s cubic-bezier(.2,.8,.2,1) both; }
  .modal-head { position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:18px 20px; background:var(--surface); border-bottom:1px solid var(--line); }
  .modal-body { padding:18px 20px; }
  .modal-foot { position:sticky; bottom:0; z-index:2; display:flex; justify-content:space-between; gap:10px; padding:14px 20px; background:var(--surface); border-top:1px solid var(--line); }
  .bag-entry-card, .expense-entry-card { padding:14px; margin-bottom:11px; border:1px solid var(--line); border-radius:17px; background:var(--surface-2); }
  .entry-card-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
  .entry-card-title { display:flex; align-items:center; gap:9px; font-weight:850; }
  .entry-card-number { display:grid; place-items:center; width:30px; height:30px; border-radius:10px; color:var(--primary); background:var(--primary-soft); box-shadow:inset 0 1px #ffffff90; }
  .melon-svg { display:inline-block; width:1.25em; height:1.25em; vertical-align:-.22em; flex:none; }
  .type-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .type-pill { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:12px; padding:8px 10px; background:var(--surface-2); }
  .type-pill button { border:0; background:transparent; color:var(--negative); font-size:15px; padding:1px 4px; }
  .month-focus { display:flex; justify-content:flex-end; align-items:center; gap:9px; margin-bottom:14px; }
  .month-focus input { max-width:190px; }
  @keyframes fadeIn { from {opacity:0} to {opacity:1} }
  @keyframes modalIn { from {opacity:0; transform:translateY(14px) scale(.985)} to {opacity:1; transform:translateY(0) scale(1)} }
  @keyframes viewEnter { from {opacity:0; transform:translateY(7px)} to {opacity:1; transform:translateY(0)} }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important; } }
  .subsection { padding-top:18px; margin-top:18px; border-top:1px dashed var(--line); }
  .subsection-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .inline-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .check-row { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; color:var(--muted); }
  .check-row input { width:16px; min-height:16px; height:16px; accent-color:var(--primary); }
  .filter-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .filter-row input { width:auto; min-width:160px; }
  .report-summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:16px; }
  .report-tile { padding:13px 14px; border-radius:15px; background:var(--surface-2); border:1px solid var(--line); }
  .report-tile span { display:block; color:var(--muted); font-size:11px; font-weight:700; } .report-tile strong { display:block; font-size:18px; margin-top:5px; letter-spacing:-.5px; }
  .notice { border-radius:14px; padding:12px 14px; color:var(--muted); background:var(--surface-2); border:1px solid var(--line); font-size:12px; }
  .settings-layout { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
  .setting-choice { display:flex; flex-wrap:wrap; gap:8px; }
  .choice { border:1px solid var(--line); border-radius:12px; padding:10px 13px; color:var(--muted); font-weight:750; background:var(--surface-2); }
  .choice.active { background:var(--primary-soft); color:var(--primary); border-color:color-mix(in srgb,var(--primary) 30%,var(--line)); }
  .profile-hero { display:flex; align-items:center; gap:15px; margin-bottom:18px; }
  .profile-big { width:68px; height:68px; border-radius:23px; display:grid; place-items:center; font-size:30px; background:linear-gradient(145deg,var(--primary-2),var(--primary)); box-shadow:inset 0 2px #ffffff8a, 0 10px 20px color-mix(in srgb,var(--primary) 18%,transparent); }
  .empty { text-align:center; padding:30px 16px; color:var(--muted); }
  .empty .empty-icon { font-size:30px; margin-bottom:8px; }

  .toast.show { opacity:1; transform:translate(-50%,0); }
  .mobile-note { font-size:11px; color:var(--muted); margin-top:14px; text-align:center; }
  .footer { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:20px 3px 0; margin-top:22px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
  .hidden { display:none !important; }
  @media(max-width:960px) { .grid.kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } .grid.two { grid-template-columns:1fr; } .quick-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }

    .nav-btn { display:flex; flex-direction:column; justify-content:center; align-items:center; gap:3px; min-width:0; min-height:53px; padding:5px 2px; border:0; border-radius:15px; color:var(--muted); font-size:10px; white-space:normal; line-height:1.1; transition:background .2s,color .2s,transform .2s; }
    .nav-btn .nav-emoji { font-size:19px; line-height:1; }

    .nav-btn:active { transform:scale(.96); }
    .calc-strip,.calc-strip.three-col { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .calc-item { padding:12px; }
    .calc-item strong { font-size:18px; }
    .modal-layer { align-items:flex-end; padding:0; }
    .modal-panel { width:100%; max-height:92dvh; border-radius:24px 24px 0 0; border-bottom:0; animation:modalIn .22s ease both; }
    .modal-head { padding:17px 16px; }
    .modal-body { padding:14px 16px; }
    .modal-foot { padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .month-focus { justify-content:space-between; }
    .month-focus input { max-width:160px; } .topbar { align-items:flex-start; } .brand-title { font-size:16px; } .brand-mark { width:42px; height:42px; border-radius:14px; }
    .profile-chip .profile-name { display:none; } .product-switch { width:100%; } .product-tab { min-width:0; flex:1 1 0; justify-content:center; flex-wrap:wrap; padding:7px 5px; font-size:11px; line-height:1.2; gap:5px; white-space:normal; overflow-wrap:anywhere; } .product-tab .mini-icon { width:26px; height:26px; } .product-tab .muted { max-width:100%; font-size:10px; white-space:normal; overflow-wrap:anywhere; }
    .context-row { align-items:flex-start; flex-direction:column; } .context-actions { width:100%; } .context-actions .btn { flex:1; }
    .nav-btn { padding:11px 12px; font-size:12px; } .card { padding:15px; border-radius:18px; } .kpi { padding:14px; } .kpi-icon { width:30px; height:30px; border-radius:11px; } .kpi-value { font-size:22px; }
    .form-grid, .inline-fields, .settings-layout { grid-template-columns:1fr; } .report-summary { grid-template-columns:repeat(2,minmax(0,1fr)); } .quick-card { padding:11px; min-height:74px; gap:8px; } .quick-icon { width:36px; height:36px; font-size:18px; }
    .filter-row { align-items:stretch; } .filter-row input { flex:1; min-width:120px; } .form-actions .btn { flex:1; } .calc-strip { align-items:flex-start; }

  @media print {
    body { background:white !important; color:#111 !important; font-size:10px !important; }
    body.printing-report * { visibility:hidden !important; }
    body.printing-report #printArea, body.printing-report #printArea * { visibility:visible !important; }

    body.printing-report #printArea table { min-width:0 !important; font-size:8px !important; }
    body.printing-report #printArea th, body.printing-report #printArea td { padding:5px 4px !important; color:#111 !important; border-color:#ddd !important; white-space:normal !important; }
    body.printing-report #printArea .report-tile { background:#fafafa !important; border-color:#ddd !important; }
    body.printing-report #printArea .report-tile strong { font-size:12px !important; }
    body.printing-report #printArea .eyebrow { color:#555 !important; }
    body.printing-report #printArea h1 { font-size:22px !important; }
    body.printing-report #printArea .tag { color:#222 !important; background:#eee !important; }
    @page { size:landscape; margin:12mm; }
  }
</style>

<body data-theme="light" data-product="brinjal" class="text-medium">
<div class="app-shell" id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">🌱</div>
      <div><div class="brand-title">FieldLedger</div><div class="brand-sub">Your farm business, in one place</div></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="quickThemeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
      <button class="icon-btn" id="quickTextBtn" aria-label="Change text size" title="Change text size">Aa</button>
      <button class="profile-chip" data-nav="profile" title="Open profile"><span class="avatar" id="avatarInitial">T</span><span class="profile-name" id="profileChipName">My Farm</span><span>⌄</span></button>
    </div>
  </header>

  <div class="product-switch" role="tablist" aria-label="Choose product">
    <button class="product-tab active" data-product-tab="brinjal" role="tab" aria-selected="true"><span class="mini-icon">🍆</span> Brinjal <span class="muted">/ கத்திரிக்காய்</span></button>
    <button class="product-tab" data-product-tab="muskmelon" role="tab" aria-selected="false"><span class="mini-icon melon-tab-icon"><svg class="melon-svg" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="melonGradTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8f28a"/><stop offset="1" stop-color="#8dbb42"/></linearGradient></defs><ellipse cx="20" cy="22" rx="15" ry="12" fill="url(#melonGradTop)" stroke="#6c9637" stroke-width="1.4"/><path d="M7 22 Q20 7 33 22 M10 29 Q20 16 30 29 M14 11 Q20 22 14 33 M26 11 Q20 22 26 33" fill="none" stroke="#f7ffd8" stroke-width="1.1" opacity=".9"/><path d="M20 10 Q17 4 22 3 Q28 5 24 10Z" fill="#4f8c3e"/><path d="M20 11 Q14 5 11 9 Q14 13 20 11Z" fill="#78ab43"/></svg></span> Muskmelon <span class="muted">/ முலாம்பழம்</span></button>
  </div>

  <div class="context-row">
    <div><div class="eyebrow" id="pageEyebrow">Farm overview · October 2026</div><h1 id="pageTitle">Brinjal business</h1></div>
    <div class="context-actions"><button class="btn" data-nav="entry">＋ Daily entry</button><button class="btn primary" data-nav="reports">▤ Monthly statement</button></div>
  </div>

  <nav class="nav" aria-label="Main navigation">
    <button class="nav-btn active" data-nav="dashboard"><span class="nav-emoji">⌂</span><span>Overview</span></button>
    <button class="nav-btn" data-nav="entry"><span class="nav-emoji">✚</span><span>Daily entry</span></button>
    <button class="nav-btn" data-nav="records"><span class="nav-emoji">▤</span><span>Records</span></button>
    <button class="nav-btn" data-nav="reports"><span class="nav-emoji">▥</span><span>Reports</span></button>
    <button class="nav-btn" data-nav="tools"><span class="nav-emoji">•••</span><span>More</span></button>
  </nav>

  <main id="viewContainer" class="view" aria-live="polite"></main>
  <footer class="footer"><span>FieldLedger prototype · Data is saved in this browser</span><span>Designed for phone, tablet and desktop</span></footer>
</div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden" />
<div class="toast" id="toast" role="status"></div>
<div id="modalRoot"></div>
<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'fieldledger-prototype-v1';
  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
  const fmt = n => new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2 }).format(Number(n || 0));
  const money = n => '₹' + fmt(n);
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const currentMonth = () => todayISO().slice(0,7);
  const monthLabel = ym => { const [y,m] = String(ym || currentMonth()).split('-').map(Number); return new Date(y,(m||1)-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'}); };
  const dateLabel = iso => { if (!iso) return '—'; const [y,m,d] = String(iso).split('-').map(Number); return new Date(y,(m||1)-1,d||1).toLocaleDateString('en-IN',{day:'numeric',month:'short'}); };
  const clone = obj => JSON.parse(JSON.stringify(obj));
  const seedState = () => ({
    version: 1,
    settings: { theme:'light', textSize:'medium', brinjalTypes:['Local','Hybrid','Long','Round'] },
    profile: { name:'Tharun', farmName:'My Farm', phone:'', location:'Tamil Nadu' },
    data: {
      brinjal: [
        {id:'b1',date:'2026-10-01',bags:10,kg:320,rate:15,expenses:1500,men:3,women:0,maleWage:500,femaleWage:400,manualKg:false},
        {id:'b2',date:'2026-10-02',bags:12,kg:384,rate:15,expenses:1500,men:4,women:0,maleWage:500,femaleWage:400,manualKg:false},
        {id:'b3',date:'2026-10-03',bags:15,kg:480,rate:15,expenses:1500,men:4,women:0,maleWage:500,femaleWage:400,manualKg:false},
        {id:'b4',date:'2026-10-04',bags:10,kg:320,rate:15,expenses:1500,men:3,women:0,maleWage:500,femaleWage:400,manualKg:false},
        {id:'b5',date:'2026-10-05',bags:15,kg:480,rate:15,expenses:1500,men:4,women:0,maleWage:500,femaleWage:400,manualKg:false},
        {id:'b6',date:'2026-10-06',bags:12,kg:384,rate:15,expenses:1500,men:4,women:0,maleWage:500,femaleWage:400,manualKg:false},
        {id:'b7',date:'2026-10-07',bags:10,kg:320,rate:15,expenses:1500,men:4,women:0,maleWage:500,femaleWage:400,manualKg:false},
        {id:'b8',date:'2026-10-08',bags:10,kg:320,rate:15,expenses:1500,men:3,women:0,maleWage:500,femaleWage:400,manualKg:false}
      ],
      muskmelon: [
        {id:'m1',date:'2026-10-02',kg:3500,rate:15,expenses:3000},
        {id:'m2',date:'2026-10-04',kg:2000,rate:12,expenses:0},
        {id:'m3',date:'2026-10-10',kg:1500,rate:10,expenses:5000},
        {id:'m4',date:'2026-10-12',kg:1200,rate:10,expenses:2000},
        {id:'m5',date:'2026-10-18',kg:1500,rate:10,expenses:0},
        {id:'m6',date:'2026-10-20',kg:1200,rate:10,expenses:8000}
      ]
    }
  });
  let state;
  const freshState = seedState();
  try {
    const savedText = localStorage.getItem(STORAGE_KEY);
    const saved = savedText ? JSON.parse(savedText) : null;
    state = saved ? {...freshState, ...saved, settings:{...freshState.settings,...(saved.settings||{})}, profile:{...freshState.profile,...(saved.profile||{})}, data:{brinjal:[...(saved.data?.brinjal||freshState.data.brinjal)],muskmelon:[...(saved.data?.muskmelon||freshState.data.muskmelon)]}} : freshState;
  } catch (_) { state = freshState; }
  let activeProduct = 'brinjal';
  let activeView = 'dashboard';
  let editingId = null;
  let reportMonth = currentMonth();
  let toastTimer;
  let bagDetailsDraft = [];
  let expenseDetailsDraft = [];
  let modalBagDraft = [];
  let modalExpenseDraft = [];
  const melonSvg = '<svg class="melon-svg" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="melonGradInline" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8f28a"/><stop offset="1" stop-color="#8dbb42"/></linearGradient></defs><ellipse cx="20" cy="22" rx="15" ry="12" fill="url(#melonGradInline)" stroke="#6c9637" stroke-width="1.4"/><path d="M7 22 Q20 7 33 22 M10 29 Q20 16 30 29 M14 11 Q20 22 14 33 M26 11 Q20 22 26 33" fill="none" stroke="#f7ffd8" stroke-width="1.1" opacity=".9"/><path d="M20 10 Q17 4 22 3 Q28 5 24 10Z" fill="#4f8c3e"/><path d="M20 11 Q14 5 11 9 Q14 13 20 11Z" fill="#78ab43"/></svg>';
  const cfg = {
    brinjal: {name:'Brinjal', icon:'🍆', subtitle:'Bag-by-bag weight, variety, sales and labour', unit:'kg'},
    muskmelon: {name:'Muskmelon', icon:melonSvg, subtitle:'Monthly production, income and expenses', unit:'kg'}
  };
  function upgradeDataModel(){
    state.settings = {...{theme:'light',textSize:'medium',brinjalTypes:['Local','Hybrid','Long','Round']},...(state.settings||{})};
    if(!Array.isArray(state.settings.brinjalTypes)||!state.settings.brinjalTypes.length) state.settings.brinjalTypes=['Local','Hybrid','Long','Round'];
    delete state.settings.bagWeight; delete state.settings.maleWage; delete state.settings.femaleWage;
    (state.data.brinjal||[]).forEach(r=>{
      const count=Math.max(0,Number(r.bags||0));
      if(!Array.isArray(r.bagDetails)){
        const each=count?Number(r.kg||0)/count:32;
        r.bagDetails=Array.from({length:count},()=>({weight:Number(each.toFixed(2)),type:state.settings.brinjalTypes[0]||'Local',size:'M'}));
      }
      r.bags=r.bagDetails.length; r.kg=Number(r.bagDetails.reduce((sum,b)=>sum+Number(b.weight||0),0).toFixed(2));
      if(!Array.isArray(r.expenseItems)) r.expenseItems=Number(r.expenses||0)>0?[{date:r.date||todayISO(),purpose:'Daily farm expenses',amount:Number(r.expenses||0),notes:''}]:[];
      r.expenses=Number(r.expenseItems.reduce((sum,x)=>sum+Number(x.amount||0),0).toFixed(2));
    });
    (state.data.muskmelon||[]).forEach(r=>{
      if(!Array.isArray(r.expenseItems)) r.expenseItems=Number(r.expenses||0)>0?[{date:r.date||todayISO(),purpose:'Daily farm expenses',amount:Number(r.expenses||0),notes:''}]:[];
      r.expenses=Number(r.expenseItems.reduce((sum,x)=>sum+Number(x.amount||0),0).toFixed(2));
    });
  }
  upgradeDataModel();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
  const dataset = () => state.data[activeProduct] || (state.data[activeProduct]=[]);
  const brinjalGross = r => Number(r.kg||0) * Number(r.rate||0);
  const labourSalary = r => Number(r.men||0)*Number(r.maleWage||0) + Number(r.women||0)*Number(r.femaleWage||0);
  const rowGross = r => activeProduct === 'brinjal' ? brinjalGross(r) : Number(r.kg||0)*Number(r.rate||0);
  const rowNet = r => activeProduct === 'brinjal' ? rowGross(r)-Number(r.expenses||0)-labourSalary(r) : rowGross(r)-Number(r.expenses||0);
  function saveState(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) { showToast('Browser storage is full; please export a backup.'); } }
  function showToast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2800); }
  function totals(rows, product=activeProduct){
    return rows.reduce((t,r)=>{
      t.kg += Number(r.kg||0); t.bags += Number(r.bags||0); t.gross += Number(r.kg||0)*Number(r.rate||0); t.expenses += Number(r.expenses||0);
      if(product==='brinjal'){t.men+=Number(r.men||0);t.women+=Number(r.women||0);t.labour+=Number(r.men||0)+Number(r.women||0);t.labourSalary+=labourSalary(r);}
      return t;
    },{kg:0,bags:0,gross:0,expenses:0,men:0,women:0,labour:0,labourSalary:0});
  }
  function filteredRows(month=reportMonth, product=activeProduct){ return (state.data[product]||[]).filter(r=>String(r.date||'').startsWith(month)).slice().sort((a,b)=>a.date.localeCompare(b.date)); }
  function applySettings(){ document.body.dataset.theme = state.settings.theme || 'light'; document.body.dataset.product = activeProduct; document.body.classList.remove('text-small','text-medium','text-large'); document.body.classList.add('text-'+(state.settings.textSize||'medium')); $('#quickThemeBtn').textContent = state.settings.theme==='dark' ? '☀️' : '🌙'; $('#avatarInitial').textContent=(state.profile.name||'F').trim().charAt(0).toUpperCase()||'F'; $('#profileChipName').textContent=state.profile.farmName || 'My Farm'; $$('.product-tab').forEach(b=>{const on=b.dataset.productTab===activeProduct;b.classList.toggle('active',on);b.setAttribute('aria-selected',String(on));}); $$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===activeView)); }
  function shellTitle(){
    const d = new Date(reportMonth+'-01T12:00:00'); const month = d.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
    const map={dashboard:[`${cfg[activeProduct].name} · ${month}`,`${cfg[activeProduct].name} business`],entry:['Daily record','Add daily entry'],records:['Your saved records','Daily records'],reports:[`Monthly statement · ${month}`,'Monthly report'],tools:['Take your data with you','Data & exports'],settings:['Make it work your way','Settings'],profile:['Your workspace','Profile']};
    const [eyebrow,title]=map[activeView]||map.dashboard; $('#pageEyebrow').textContent=eyebrow; $('#pageTitle').textContent=title;
  }
  function kpi(label,value,icon,note=''){return `<div class="card kpi"><div class="kpi-top"><span>${label}</span><span class="kpi-icon">${icon}</span></div><div class="kpi-value mono">${value}</div><div class="kpi-note">${note}</div></div>`;}
  function dashboardView(){
    if(activeProduct==='muskmelon') return muskmelonMonthlyDashboardView();
    const monthRows=filteredRows(reportMonth); const t=totals(monthRows); const all=dataset().slice().sort((a,b)=>b.date.localeCompare(a.date)); const recent=all.slice(0,5);
    const grossThis=t.gross; const netThis=t.gross-t.expenses-(activeProduct==='brinjal'?t.labourSalary:0);
    let cards = activeProduct==='brinjal' ?
      kpi('Total bags',fmt(t.bags),'🧺','Bags recorded this month')+kpi('Total weight',fmt(t.kg)+' kg','⚖️','Based on daily entries')+kpi('Gross sales',money(grossThis),'💹','Weight × rate per kg')+kpi('Net after costs',money(netThis),'✨','Sales − expenses − labour') :
      kpi('Total quantity',fmt(t.kg)+' kg','⚖️','Quantity recorded this month')+kpi('Gross income',money(grossThis),'💛','Kg × rate per kg')+kpi('Expenses',money(t.expenses),'🧾','Manually entered costs')+kpi('Net after costs',money(netThis),'✨','Gross income − expenses');
    const chartRows=monthRows.slice(-7); const max=Math.max(1,...chartRows.map(r=>Number(r.kg||0)*Number(r.rate||0)));
    const chart=chartRows.length?chartRows.map(r=>`<div class="bar-col"><div class="bar-value">${fmtShort(rowGrossForProduct(r,activeProduct))}</div><div class="bar" style="height:${Math.max(4,Math.round(rowGrossForProduct(r,activeProduct)/max*125))}px"></div><div class="bar-label">${escapeHtml(dateLabel(r.date))}</div></div>`).join(''):`<div class="empty">No records for this month yet.</div>`;
    const recentRows=recent.length?recent.map(r=>`<tr><td><strong>${escapeHtml(dateLabel(r.date))}</strong></td>${activeProduct==='brinjal'?`<td>${fmt(r.bags)} bags</td>`:''}<td>${fmt(r.kg)} kg</td><td>${money(rowGrossForProduct(r,activeProduct))}</td><td class="${rowNetForProduct(r,activeProduct)>=0?'positive':'negative'}">${money(rowNetForProduct(r,activeProduct))}</td><td><button class="btn small-btn" data-action="edit" data-id="${escapeHtml(r.id)}">Edit</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty"><div class="empty-icon">🗂️</div>No entries yet. Add your first daily record.</div></td></tr>`;
    return `<div class="grid kpis">${cards}</div>
      <div class="grid two section-gap">
        <section class="card"><div class="card-head"><div><h2>Sales activity</h2><div class="muted small">Daily gross amount · ${escapeHtml(monthLabel(reportMonth))}</div></div><span class="tag">${chartRows.length} entries</span></div><div class="chart">${chart}</div><div class="small muted" style="margin-top:12px">Bars show gross sales by date, before expenses and labour costs.</div></section>
        <section class="card"><div class="card-head"><div><h2>Quick actions</h2><div class="muted small">Everything you need for today</div></div><span class="kpi-icon">✨</span></div><div class="quick-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
          <button class="quick-card" data-nav="entry"><span class="quick-icon">✚</span><span><strong>New daily entry</strong><span>Add today's numbers</span></span></button>
          <button class="quick-card" data-nav="reports"><span class="quick-icon">▤</span><span><strong>Monthly report</strong><span>View statement</span></span></button>
          <button class="quick-card" data-nav="tools"><span class="quick-icon">📤</span><span><strong>Export data</strong><span>Excel, PDF, PNG</span></span></button>
          <button class="quick-card" data-nav="settings"><span class="quick-icon">⚙️</span><span><strong>Preferences</strong><span>Theme & brinjal types</span></span></button>
        </div></section>
      </div>
      <section class="card section-gap"><div class="card-head"><div><h2>Recent entries</h2><div class="muted small">Latest saved days for ${cfg[activeProduct].name}</div></div><button class="btn small-btn" data-nav="records">View all →</button></div><div class="table-wrap"><table><thead><tr><th>Date</th>${activeProduct==='brinjal'?'<th>Bags</th>':''}<th>Weight</th><th>Gross amount</th><th>Net after costs</th><th>Action</th></tr></thead><tbody>${recentRows}</tbody></table></div></section>`;
  }
  function muskmelonMonthlyDashboardView(){
    const rows=dataset().slice().sort((a,b)=>b.date.localeCompare(a.date));
    const monthMap=new Map();
    rows.forEach(r=>{const key=String(r.date||'').slice(0,7);if(!key)return;if(!monthMap.has(key))monthMap.set(key,[]);monthMap.get(key).push(r);});
    const months=[...monthMap.entries()].sort((a,b)=>b[0].localeCompare(a[0]));
    const selected=filteredRows(reportMonth); const t=totals(selected); const net=t.gross-t.expenses;
    const monthRows=months.length?months.map(([month,items])=>{const mt=totals(items,'muskmelon');const mn=mt.gross-mt.expenses;return `<tr><td><strong>${escapeHtml(monthLabel(month))}</strong><div class="muted small">${items.length} daily record${items.length===1?'':'s'}</div></td><td>${fmt(mt.kg)} kg</td><td class="positive">${money(mt.gross)}</td><td class="negative">${money(mt.expenses)}</td><td class="${mn>=0?'positive':'negative'}">${money(mn)}</td><td><button class="btn small-btn" data-month-report="${escapeHtml(month)}">View daily statement →</button></td></tr>`;}).join(''):`<tr><td colspan="6"><div class="empty"><div class="empty-icon">${melonSvg}</div>No monthly totals yet. Add muskmelon records to get started.</div></td></tr>`;
    return `<div class="month-focus"><label class="field-label" for="dashboardMonth">Monthly focus</label><input id="dashboardMonth" type="month" value="${escapeHtml(reportMonth)}"></div>
      <div class="grid kpis">${kpi('Quantity this month',fmt(t.kg)+' kg','⚖️',monthLabel(reportMonth))}${kpi('Gross income',money(t.gross),melonSvg,'Quantity × daily rate')}${kpi('Expenses',money(t.expenses),'🧾','Expense items logged')}${kpi('Net after expenses',money(net),'✨','Gross income − expenses')}</div>
      <section class="card section-gap"><div class="card-head"><div><h2>Monthly performance</h2><div class="muted small">Muskmelon statistics are grouped by month, not by individual day.</div></div><span class="kpi-icon">${melonSvg}</span></div>
      <div class="table-wrap"><table style="min-width:620px"><thead><tr><th>Month</th><th>Total quantity</th><th>Gross income</th><th>Expenses</th><th>Net after expenses</th><th>Statement</th></tr></thead><tbody>${monthRows}</tbody></table></div>
      <div class="form-actions" style="margin-top:14px"><span class="muted small">Daily entry remains available; this overview rolls those records into monthly totals.</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-nav="records">View daily records</button><button class="btn primary" data-nav="entry">＋ Add daily entry</button></div></div></section>`;
  }
  function fmtShort(n){ n=Number(n||0); return n>=100000? (n/100000).toFixed(1)+'L':n>=1000?(n/1000).toFixed(1)+'k':fmt(n); }
  function rowGrossForProduct(r,p){return Number(r.kg||0)*Number(r.rate||0)}
  function rowNetForProduct(r,p){return rowGrossForProduct(r,p)-Number(r.expenses||0)-(p==='brinjal'?labourSalary(r):0)}
  function numOptions(selected, max=30){let out='';for(let i=0;i<=max;i++)out+=`<option value="${i}" ${Number(selected||0)===i?'selected':''}>${i}</option>`;return out;}
  function bagTypeOptions(selected){return (state.settings.brinjalTypes||[]).map(t=>`<option value="${escapeHtml(t)}" ${String(selected||'')===t?'selected':''}>${escapeHtml(t)}</option>`).join('');}
  function bagDetailsSummary(items){
    if(!items||!items.length)return '<span class="muted small">Choose the number of bags, then enter each bag’s weight, type and size.</span>';
    const total=items.reduce((n,b)=>n+Number(b.weight||0),0);
    const mix={}; items.forEach(b=>{const k=(b.type||'Type not set')+' / '+(b.size||'—');mix[k]=(mix[k]||0)+1;});
    return `<div class="small"><strong>${items.length} bags · ${fmt(total)} kg total</strong></div><div class="bag-preview">${Object.entries(mix).map(([name,count])=>`<span class="bag-chip">${escapeHtml(name)} × ${count}</span>`).join('')}</div>`;
  }
  function expenseItemsTotal(items){return Number((items||[]).reduce((n,x)=>n+Number(x.amount||0),0).toFixed(2));}
  function expenseDetailsSummary(items){
    if(!items||!items.length)return '<span class="muted small">No expense items added yet.</span>';
    const meaningful=items.filter(x=>x.purpose||Number(x.amount||0));
    return `<div class="small"><strong>${meaningful.length} expense item${meaningful.length===1?'':'s'} · ${money(expenseItemsTotal(items))}</strong></div><div class="muted small">${meaningful.slice(0,3).map(x=>`${escapeHtml(x.purpose||'Expense')} · ${money(x.amount||0)}`).join(' &nbsp; · &nbsp; ')}${meaningful.length>3?' · +'+(meaningful.length-3)+' more':''}</div>`;
  }
  function entryView(){
    const old=editingId ? dataset().find(r=>r.id===editingId) : null;
    const today=old?.date||todayISO();
    const latest=dataset().slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
    const rate=old?.rate ?? latest?.rate ?? (activeProduct==='brinjal'?15:10);
    bagDetailsDraft=clone(old?.bagDetails||[]);
    expenseDetailsDraft=clone(old?.expenseItems||[]);
    if(activeProduct==='brinjal'){
      const bagCount=old?.bags ?? '';
      const men=old?.men??0; const women=old?.women??0;
      const bagOptions=Array.from({length:50},(_,i)=>i+1).map(n=>`<option value="${n}" ${Number(bagCount)===n?'selected':''}>${n} bag${n===1?'':'s'}</option>`).join('');
      const weight=bagDetailsDraft.reduce((n,b)=>n+Number(b.weight||0),0);
      return `<section class="card"><div class="card-head"><div><h2>${old?'Edit':'Add'} brinjal daily entry</h2><div class="muted small">Record each bag separately. Total weight is summed from the bag details.</div></div><span class="kpi-icon">🍆</span></div>
      <form id="entryForm"><input type="hidden" name="id" value="${escapeHtml(old?.id||'')}"><div class="form-grid">
        <div class="field"><label for="entryDate">Date</label><input id="entryDate" name="date" type="date" required value="${escapeHtml(today)}"></div>

  function setupEntryCalculator(){
    const form=$('#entryForm'); if(!form)return;
    const recalc=()=>{
      const get=n=>Number(form.elements[n]?.value||0);
      if(activeProduct==='brinjal'){
        form.elements.kg.value=Number(bagDetailsDraft.reduce((sum,b)=>sum+Number(b.weight||0),0).toFixed(2));
        form.elements.bags.value=bagDetailsDraft.length?String(bagDetailsDraft.length):(form.elements.bags.value||'');
      }
      const gross=get('kg')*get('rate'); const exp=expenseItemsTotal(expenseDetailsDraft);
      if(form.elements.expenses)form.elements.expenses.value=String(exp);
      let labour=0;
      if(activeProduct==='brinjal') labour=get('men')*get('maleWage')+get('women')*get('femaleWage');
      $('#calcGross').textContent=money(gross); $('#calcExpenses').textContent=money(exp);
      if($('#calcLabour'))$('#calcLabour').textContent=money(labour);
      $('#calcNet').textContent=money(gross-exp-labour);
    };
    form.addEventListener('input',recalc); form.addEventListener('change',recalc); recalc();
    form.addEventListener('submit',e=>{
      e.preventDefault(); const fd=new FormData(form); const id=String(fd.get('id')||''); const date=String(fd.get('date')||''); if(!date){showToast('Please choose a date.');return;}
      if(activeProduct==='brinjal' && (!bagDetailsDraft.length || bagDetailsDraft.length!==Number(fd.get('bags')||0))){showToast('Please enter details for every selected bag.');openBagModal();return;}
      const existing=dataset().find(r=>r.date===date && r.id!==id); if(existing && !confirm('An entry already exists for this product and date. Replace it?'))return;
      const rowExpenses=expenseItemsTotal(expenseDetailsDraft);
      let row={id:id||makeId(),date,kg:Number(fd.get('kg')||0),rate:Number(fd.get('rate')||0),expenses:rowExpenses,expenseItems:clone(expenseDetailsDraft)};
      if(activeProduct==='brinjal'){
        row={...row,bags:bagDetailsDraft.length,bagDetails:clone(bagDetailsDraft),men:Number(fd.get('men')||0),women:Number(fd.get('women')||0),maleWage:Number(fd.get('maleWage')||0),femaleWage:Number(fd.get('femaleWage')||0)};
        row.kg=Number(bagDetailsDraft.reduce((sum,b)=>sum+Number(b.weight||0),0).toFixed(2));
      }
      const arr=dataset(); const idx=arr.findIndex(r=>r.id===id || r.date===date); if(idx>=0)arr[idx]=row;else arr.push(row);
      saveState(); editingId=null; bagDetailsDraft=[];expenseDetailsDraft=[]; reportMonth=date.slice(0,7); showToast('Daily entry saved successfully.'); navigate('records');
    });
    if(activeProduct==='brinjal'){
      $('#bags').addEventListener('change',()=>{const count=Number($('#bags').value||0);if(count>0)openBagModal(true);else{bagDetailsDraft=[];$('#kg').value='0';$('#bagDetailsSummary').innerHTML=bagDetailsSummary([]);recalc();}});

  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot')?.innerHTML)closeModal();});
  $('#quickThemeBtn').addEventListener('click',()=>{state.settings.theme=state.settings.theme==='dark'?'light':'dark';saveState();render();});
  $('#quickTextBtn').addEventListener('click',()=>{const cycle={small:'medium',medium:'large',large:'small'};state.settings.textSize=cycle[state.settings.textSize||'medium'];saveState();render();showToast('Text size: '+state.settings.textSize+'.');});
  $('#viewContainer').addEventListener('change',e=>{if(e.target.id==='reportMonth'||e.target.id==='dashboardMonth'){reportMonth=e.target.value||currentMonth();render();}});
  $('#viewContainer').addEventListener('submit',e=>{
    if(e.target.id==='typeForm'){e.preventDefault();const fd=new FormData(e.target);const value=String(fd.get('type')||'').trim();if(!value)return;if((state.settings.brinjalTypes||[]).some(t=>t.toLowerCase()===value.toLowerCase())){showToast('That brinjal type already exists.');return;}state.settings.brinjalTypes.push(value);saveState();render();showToast('Brinjal type added to the dropdown.');}
    if(e.target.id==='profileForm'){e.preventDefault();const fd=new FormData(e.target);state.profile={name:String(fd.get('name')||''),farmName:String(fd.get('farmName')||''),phone:String(fd.get('phone')||''),location:String(fd.get('location')||'')};saveState();render();showToast('Profile saved.');}
  });
  // Report month selector is rendered with the same shared month context.
  const originalReportView=reportView;
  reportView=function(){const markup=originalReportView();return markup.replace('<div id="reportArea">','<div id="reportArea"><div class="no-print" style="margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><label class="field-label" for="reportMonth">Report month</label><input id="reportMonth" type="month" value="'+escapeHtml(reportMonth)+'" style="max-width:220px"></div>');};
  // Keep date/month changes live, and default to the month currently selected.
  render();
})();
</script>
</body>
</html>
