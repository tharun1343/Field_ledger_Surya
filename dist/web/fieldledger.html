<title>FieldLedger Farm Ledger</title>
<meta name="theme-color" content="#6d45d9">
<style>
  :root {
    --bg: #f5f5fb; --surface: #ffffff; --surface-2: #f8f7fc; --text: #201d2b; --muted: #6c6880;
    --line: #e8e5ef; --primary: #7248df; --primary-2: #a18af4; --primary-soft: #f0eaff; --on-primary: #ffffff;

    --radius: 22px; --fs: 1;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size:calc(14px * var(--fs)); line-height: 1.45; transition: background .2s, color .2s; overflow-x: hidden; }
  body[data-product="muskmelon"] { --primary: #b07a06; --primary-2: #f1c24f; --primary-soft: #fff3cf; }
  body[data-theme="dark"] { --bg: #111018; --surface: #1c1a26; --surface-2: #242130; --text: #f2effb; --muted: #aaa5bb; --line: #353142; --primary: #a68bff; --primary-2: #7a5ae6; --primary-soft: #302745; --positive: #4fd39a; --negative: #ff7b7b; --labour: #c79bff; --warn-bg: #3a3020; --warn-line: #6b5426; --warn-text: #f4d58d; --shadow: 0 12px 36px rgba(0,0,0,.22); }
  body[data-theme="dark"][data-product="muskmelon"] { --primary: #f3c044; --primary-2: #c48c10; --primary-soft: #3a2f17; }
  body.text-small { --fs: .9; font-size:calc(12.6px * var(--fs)); } body.text-large { --fs: 1.15; font-size:calc(16px * var(--fs)); }
  body.modal-open { overflow: hidden; }
  button, input, select, textarea { font: inherit; } button { cursor: pointer; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 60%, transparent); outline-offset: 2px; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .ico { width:1.2em; height:1.2em; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.22em; }
  .app-shell { max-width: 1440px; margin: auto; padding: 18px clamp(12px, 2.5vw, 34px) 38px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px; }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .brand-mark { width:48px; height:48px; border-radius:17px; display:grid; place-items:center; font-size:calc(25px * var(--fs)); background:linear-gradient(145deg,var(--primary-2),var(--primary)); box-shadow:inset 0 2px 2px #ffffff99, 0 7px 13px color-mix(in srgb, var(--primary) 25%, transparent); transform:rotate(-3deg); flex:none; }
  .brand-title { font-size:calc(18px * var(--fs)); font-weight:850; letter-spacing:-.5px; line-height:1.15; }
  .brand-sub { color:var(--muted); font-size:calc(12px * var(--fs)); margin-top:4px; }
  .top-actions { display:flex; align-items:center; gap:8px; }
  .icon-btn, .profile-chip { border:1px solid var(--line); color:var(--text); background:var(--surface); border-radius:14px; min-height:44px; padding:0 12px; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 3px 9px rgba(25,20,50,.025); }
  .icon-btn { width:44px; font-size:calc(16px * var(--fs)); padding:0; font-weight:800; flex:none; }
  .profile-chip { font-weight:700; max-width:220px; }
  .profile-chip .profile-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .avatar { width:25px; height:25px; display:grid; place-items:center; border-radius:9px; color:white; background:linear-gradient(145deg,var(--primary-2),var(--primary)); font-size:calc(12px * var(--fs)); flex:none; }
  .product-switch { display:flex; align-items:center; gap:8px; padding:6px; width:max-content; max-width:100%; border-radius:18px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); margin-bottom:16px; }
  .product-tab { display:flex; align-items:center; gap:9px; border:0; color:var(--muted); background:transparent; padding:10px 17px; min-height:48px; border-radius:13px; font-weight:800; white-space:nowrap; }
  .product-tab .mini-icon { width:30px; height:30px; display:grid; place-items:center; font-size:calc(17px * var(--fs)); border-radius:10px; background:var(--surface-2); box-shadow:inset 0 1px #ffffff66; }
  .product-tab.active { color:var(--primary); background:var(--primary-soft); box-shadow:inset 0 1px 0 #ffffff8c; }
  .product-tab .tamil { color:var(--muted); font-weight:600; }
  .context-row { display:flex; justify-content:space-between; align-items:end; gap:12px; margin:16px 2px 18px; }
  .eyebrow { color:var(--primary); text-transform:uppercase; font-weight:850; letter-spacing:1.5px; font-size:calc(10px * var(--fs)); }
  h1 { margin:3px 0 0; font-size:clamp(25px,3.3vw,34px); letter-spacing:-1.1px; line-height:1.12; }
  h2 { margin:0; font-size:calc(17px * var(--fs)); letter-spacing:-.35px; } h3 { margin:0; font-size:calc(14px * var(--fs)); }
  p { margin:0; } .muted { color:var(--muted); } .small { font-size:calc(12px * var(--fs)); } .mono { font-variant-numeric:tabular-nums; }
  .context-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { border:1px solid var(--line); color:var(--text); background:var(--surface); border-radius:13px; padding:10px 14px; min-height:44px; font-weight:750; display:inline-flex; align-items:center; justify-content:center; gap:7px; transition:transform .15s, box-shadow .15s, background .15s; }
  .btn:hover { transform:translateY(-1px); box-shadow:0 7px 18px rgba(30,20,60,.08); }

  body[data-product="muskmelon"] .btn.primary { color:#2b1d00; }
  body[data-theme="dark"] .btn.primary { color:#140f22; }
  .btn.soft { color:var(--primary); background:var(--primary-soft); border-color:transparent; }
  .btn.danger { color:var(--negative); background:color-mix(in srgb, var(--negative) 8%, var(--surface)); }
  .btn.small-btn { padding:7px 10px; min-height:36px; border-radius:10px; font-size:calc(12px * var(--fs)); }
  .btn-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .nav { display:flex; gap:5px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; margin:0 0 20px; }
  .nav::-webkit-scrollbar { display:none; }
  .nav-btn { border:0; background:transparent; color:var(--muted); border-bottom:3px solid transparent; padding:12px 15px 13px; white-space:nowrap; font-weight:750; display:flex; align-items:center; gap:8px; }
  .nav-btn.active { border-bottom-color:var(--primary); color:var(--primary); }
  .view { min-height:330px; }
  .grid { display:grid; gap:15px; } .grid.kpis { grid-template-columns:repeat(4,minmax(0,1fr)); } .grid.kpis.six { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .grid.two { grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr); }
  .grid.equal { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .card { min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
  .card-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:15px; flex-wrap:wrap; }
  .kpi { position:relative; overflow:hidden; padding:17px; }
  .kpi::after { content:""; position:absolute; width:95px; height:95px; border-radius:50%; right:-40px; bottom:-45px; background:var(--primary-soft); opacity:.9; }
  .kpi-top { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); font-weight:700; font-size:calc(12px * var(--fs)); position:relative; z-index:1; }
  .kpi-icon { width:36px; height:36px; border-radius:13px; display:grid; place-items:center; flex:none; font-size:calc(18px * var(--fs)); color:var(--primary); background:var(--primary-soft); box-shadow:inset 0 1px 1px #ffffff8c, 0 4px 8px color-mix(in srgb, var(--primary) 10%, transparent); }
  .kpi-value { font-size:clamp(20px,2.1vw,28px); font-weight:850; letter-spacing:-.8px; margin-top:15px; position:relative; z-index:1; overflow-wrap:anywhere; }
  .kpi-note { margin-top:3px; color:var(--muted); font-size:calc(11px * var(--fs)); position:relative; z-index:1; }
  .kpi.sale .kpi-value { color:var(--positive); } .kpi.expense .kpi-value { color:var(--negative); } .kpi.labour .kpi-value { color:var(--labour); }
  .section-gap { margin-top:16px; }
  .quick-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
  .quick-grid.cols-2 { grid-template-columns:repeat(2,minmax(0,1fr)); } .quick-grid.cols-1 { grid-template-columns:1fr; }
  .quick-card { text-align:left; display:flex; align-items:center; gap:11px; min-height:72px; padding:14px; border:1px solid var(--line); border-radius:17px; background:var(--surface-2); color:var(--text); min-width:0; transition:transform .15s, border-color .15s; }
  .quick-card:hover { border-color:var(--primary-2); transform:translateY(-1px); }
  .quick-icon { flex-shrink:0; height:42px; width:42px; display:grid; place-items:center; border-radius:14px; font-size:calc(19px * var(--fs)); color:var(--primary); background:linear-gradient(145deg,var(--primary-soft),var(--surface)); box-shadow:inset 0 1px #ffffffa6, 0 5px 10px rgba(25,20,50,.05); }
  .quick-card strong { display:block; font-size:calc(12px * var(--fs)); } .quick-card span > span { color:var(--muted); font-size:calc(11px * var(--fs)); display:block; margin-top:3px; }
  .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:14px; max-width:100%; }
  table { width:100%; border-collapse:separate; border-spacing:0; min-width:650px; font-size:calc(12px * var(--fs)); }
  thead th { background:var(--surface-2); color:var(--muted); text-align:left; text-transform:uppercase; letter-spacing:.65px; font-size:calc(10px * var(--fs)); padding:12px 13px; white-space:nowrap; border-bottom:1px solid var(--line); }
  tbody td { padding:12px 13px; border-bottom:1px solid var(--line); white-space:nowrap; } tbody tr:last-child td { border-bottom:0; }
  tbody tr:hover { background:color-mix(in srgb,var(--primary-soft) 34%,transparent); }
  tfoot td { background:var(--surface-2); padding:12px 13px; font-weight:850; border-top:1px solid var(--line); white-space:nowrap; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }

  .tag.warn { color:var(--warn-text); background:var(--warn-bg); }
  .positive { color:var(--positive); font-weight:800; } .negative { color:var(--negative); font-weight:800; }
  .chart { height:190px; display:flex; align-items:end; gap:6px; padding:18px 4px 0; border-bottom:1px solid var(--line); }
  .bar-col { flex:1; height:100%; display:flex; flex-direction:column; justify-content:end; align-items:center; min-width:0; gap:6px; }
  .bar { width:min(100%,40px); min-height:4px; border-radius:10px 10px 3px 3px; background:linear-gradient(180deg,var(--primary-2),var(--primary)); box-shadow:inset 0 1px #ffffff85; }
  .bar-label { font-size:calc(10px * var(--fs)); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .bar-value { font-size:calc(9px * var(--fs)); color:var(--muted); white-space:nowrap; }
  .chart .empty { flex:1; align-self:center; }
  .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px; }
  .form-grid.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .field { display:flex; flex-direction:column; gap:7px; min-width:0; }
  .field.full { grid-column:1/-1; }
  .field label, .field-label { color:var(--muted); font-size:calc(12px * var(--fs)); font-weight:750; }
  input, select, textarea { width:100%; color:var(--text); background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:11px 13px; outline:none; min-height:46px; }
  input:focus, select:focus, textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent); }
  input[aria-invalid="true"], select[aria-invalid="true"] { border-color:var(--negative); box-shadow:0 0 0 3px color-mix(in srgb,var(--negative) 15%,transparent); }
  .field-hint { color:var(--muted); font-size:calc(11px * var(--fs)); margin-top:-2px; }
  .form-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:18px; padding-top:17px; border-top:1px solid var(--line); }
  .calc-strip { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); align-items:stretch; gap:10px; margin-top:18px; }
  .calc-strip.three-col { grid-template-columns:repeat(3,minmax(0,1fr)); } .calc-strip.four-col { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .calc-strip.six { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .calc-item.wastage strong { color:var(--muted); }
  .calc-item { min-width:0; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:0 5px 16px rgba(35,24,76,.045); }
  .calc-item span { display:block; color:var(--muted); font-size:calc(11px * var(--fs)); font-weight:750; }
  .calc-item strong { font-size:clamp(16px,1.7vw,21px); display:block; margin-top:6px; color:var(--primary); overflow-wrap:anywhere; }
  .calc-item small { display:block; color:var(--muted); font-size:calc(10px * var(--fs)); margin-top:3px; }
  .calc-item.sale strong { color:var(--positive); } .calc-item.expense strong { color:var(--negative); } .calc-item.labour strong { color:var(--labour); } .calc-item.net strong.negative { color:var(--negative); }
  .detail-edit { width:100%; text-align:left; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; min-height:56px; color:var(--text); background:var(--surface-2); border:1px solid var(--line); border-radius:13px; transition:border-color .2s,transform .2s; }
  .detail-edit:hover { border-color:var(--primary-2); transform:translateY(-1px); }
  .detail-edit strong { color:var(--primary); }
  .bag-preview { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }

  .form-section { padding-top:18px; margin-top:18px; border-top:1px dashed var(--line); }
  .form-section:first-of-type { border-top:0; margin-top:0; padding-top:0; }
  .section-title { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .section-title h3 { display:flex; align-items:center; gap:8px; }
  .labour-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .labour-card { border:1px solid var(--line); border-radius:16px; padding:13px; background:var(--surface-2); display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .labour-card .labour-title { grid-column:1/-1; font-weight:850; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .labour-card .subtotal { color:var(--labour); font-weight:800; }
  .legacy-box { margin-top:12px; border:1px solid var(--warn-line); background:var(--warn-bg); color:var(--warn-text); border-radius:14px; padding:12px 14px; font-size:calc(12px * var(--fs)); display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap; }
  .modal-layer { position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:18px; background:rgba(17,14,28,.56); backdrop-filter:blur(8px); animation:fadeIn .18s ease both; }
  .modal-panel { width:min(760px,100%); max-height:min(90dvh,920px); display:flex; flex-direction:column; background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:24px; box-shadow:0 28px 90px rgba(0,0,0,.28); animation:modalIn .24s cubic-bezier(.2,.8,.2,1) both; overflow:hidden; }
  .modal-head { flex:none; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:18px 20px; background:var(--surface); border-bottom:1px solid var(--line); }
  .modal-body { flex:1 1 auto; min-height:0; overflow:auto; overscroll-behavior:contain; padding:18px 20px; }
  .modal-foot { flex:none; display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 20px; background:var(--surface); border-top:1px solid var(--line); flex-wrap:wrap; }
  .bag-entry-card, .expense-entry-card { padding:14px; margin-bottom:11px; border:1px solid var(--line); border-radius:17px; background:var(--surface-2); }
  .entry-card-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
  .entry-card-title { display:flex; align-items:center; gap:9px; font-weight:850; }
  .entry-card-number { display:grid; place-items:center; width:30px; height:30px; border-radius:10px; color:var(--primary); background:var(--primary-soft); box-shadow:inset 0 1px #ffffff90; }
  .melon-svg { display:inline-block; width:1.3em; height:1.3em; vertical-align:-.25em; flex:none; }
  .type-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .type-pill { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:12px; padding:4px 4px 4px 11px; background:var(--surface-2); }
  .type-pill button { border:0; background:transparent; color:var(--negative); min-width:36px; min-height:36px; border-radius:9px; display:grid; place-items:center; }
  .type-pill button:hover { background:color-mix(in srgb,var(--negative) 10%,transparent); }
  .month-nav { display:flex; align-items:center; gap:6px; }
  .month-nav input { width:auto; min-width:0; max-width:190px; text-align:center; font-weight:750; }
  .month-hero { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .month-hero .big { font-size:clamp(28px,4vw,40px); font-weight:850; letter-spacing:-1.2px; margin-top:4px; }
  @keyframes fadeIn { from {opacity:0} to {opacity:1} }
  @keyframes modalIn { from {opacity:0; transform:translateY(14px) scale(.985)} to {opacity:1; transform:translateY(0) scale(1)} }
  @keyframes viewEnter { from {opacity:0; transform:translateY(6px)} to {opacity:1; transform:translateY(0)} }
  .view > * { animation:viewEnter .22s ease both; }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important; } }
  .filter-row { display:grid; grid-template-columns:200px minmax(0,1fr) auto; align-items:end; gap:10px; margin-bottom:14px; }
  .report-summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:16px; }

  .notice { border-radius:14px; padding:12px 14px; color:var(--muted); background:var(--surface-2); border:1px solid var(--line); font-size:calc(12px * var(--fs)); }
  .notice strong { color:var(--text); }
  .notice.warn { background:var(--warn-bg); border-color:var(--warn-line); color:var(--warn-text); }
  .notice.warn strong { color:inherit; }
  .settings-layout { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
  .setting-choice { display:flex; flex-wrap:wrap; gap:8px; }
  .choice { border:1px solid var(--line); border-radius:12px; padding:10px 14px; min-height:44px; color:var(--muted); font-weight:750; background:var(--surface-2); display:inline-flex; align-items:center; gap:7px; }
  .choice.active { background:var(--primary-soft); color:var(--primary); border-color:color-mix(in srgb,var(--primary) 30%,var(--line)); }
  .profile-hero { display:flex; align-items:center; gap:15px; margin-bottom:18px; }
  .profile-big { width:68px; height:68px; border-radius:23px; display:grid; place-items:center; font-size:calc(28px * var(--fs)); font-weight:850; color:#fff; background:linear-gradient(145deg,var(--primary-2),var(--primary)); box-shadow:inset 0 2px #ffffff8a, 0 10px 20px color-mix(in srgb,var(--primary) 18%,transparent); flex:none; }
  .empty { text-align:center; padding:30px 16px; color:var(--muted); white-space:normal; }
  .empty .empty-icon { font-size:calc(30px * var(--fs)); margin-bottom:8px; color:var(--primary); }
  .empty .btn { margin-top:12px; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px); background:#24202f; color:#fff; border-radius:13px; padding:12px 17px; box-shadow:0 12px 35px #0003; z-index:300; opacity:0; pointer-events:none; transition:.22s; max-width:min(520px, calc(100vw - 28px)); text-align:center; }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  /* ------------------------------------------------------------------
   * Calculations (pure, shared by every screen and export)
   * ------------------------------------------------------------------ */
  const calc = {
    bagKg: bags => sum(bags, b => num(b.weightKg)),
    expenseTotal: items => sum(items, x => num(x.amount)),
    menSubtotal: r => int(r.menCount) * num(r.menWage),
    womenSubtotal: r => int(r.womenCount) * num(r.womenWage),
    legacySalary: r => num(r.legacyLabour && r.legacyLabour.salary),
    labour: r => calc.menSubtotal(r) + calc.womenSubtotal(r) + calc.legacySalary(r),
    workers: r => int(r.menCount) + int(r.womenCount) + int(r.legacyLabour && r.legacyLabour.workers),
    kg: (p, r) => (p === 'brinjal' ? calc.bagKg(r.bagDetails) : num(r.kg)),
    wastage: r => num(r.wastageKg),
    gross: (p, r) => calc.kg(p, r) * num(r.ratePerKg),

  /**
   * Monthly statement — the single source for report screen, CSV, XLSX, PNG and PDF.
   * Expense rule: every expense item is reported on ITS OWN date. A date that has expense items but

   * expense is never counted twice or attributed to an unintended month.
   */

    const records = (state.data[product] || []);

      expenseItems.push({ ...x, recordDate: r.date });

    const dates = Array.from(new Set([...monthRecords.map(r => r.date), ...expByDate.keys()])).sort();

      const exp = expByDate.get(date) || 0;
      if (!recs.length) {

      menCount: rec ? rec.menCount : 0, womenCount: rec ? rec.womenCount : 0,
      menWage: String(rec ? rec.menWage : (latest ? latest.menWage : 500)), womenWage: String(rec ? rec.womenWage : (latest ? latest.womenWage : 400)),

            <div class="labour-card"><div class="labour-title"><span>Women</span><span class="subtotal" id="womenSubtotal"></span></div><div class="field"><label for="womenCount">Number of women</label><select id="womenCount" data-field="womenCount" data-int="1">${opts(int(d.womenCount), MAX_WORKERS)}</select></div><div class="field"><label for="womenWage">Wage per woman (₹/day)</label><input id="womenWage" type="number" inputmode="decimal" min="0" step="1" data-field="womenWage" value="${esc(d.womenWage)}"></div></div>

          <div class="calc-item sale"><span>Gross sales</span><strong id="calcGross">₹0</strong><small>Weight × rate/kg</small></div>
          <div class="calc-item expense"><span>Operating expenses</span><strong id="calcExpenses">₹0</strong><small>Sum of expense items</small></div>
          <div class="calc-item labour"><span>Labour salary</span><strong id="calcLabour">₹0</strong><small>Men + women</small></div>
          <div class="calc-item net"><span>Net after costs</span><strong id="calcNet">₹0</strong><small>Gross − expenses − labour</small></div>
        </div>`;
    } else {
      body = `${dateRate}${expenses}
        <div class="calc-strip four-col" aria-live="polite">
          <div class="calc-item wastage"><span>Wastage</span><strong id="calcWastage">0 kg</strong><small>Not priced</small></div>
          <div class="calc-item sale"><span>Gross income</span><strong id="calcGross">₹0</strong><small>Quantity × rate/kg</small></div>
          <div class="calc-item expense"><span>Operating expenses</span><strong id="calcExpenses">₹0</strong><small>Sum of expense items</small></div>
          <div class="calc-item net"><span>Net after expenses</span><strong id="calcNet">₹0</strong><small>Gross − expenses</small></div>

    }

      <div class="form-actions"><span class="muted small">${isB ? 'Bag and expense details' : 'Expense details'} stay in this draft until you save the daily entry.</span>
        <div class="btn-row">${editing ? `<button type="button" class="btn danger" data-action="entry-delete">${icon('trash')} Delete</button>` : ''}<button type="button" class="btn" data-action="entry-cancel">${editing ? 'Cancel' : 'Clear'}</button><button class="btn primary" type="submit">${icon('check')} ${editing ? 'Save changes' : 'Save daily entry'}</button></div></div>
      </form></section>
      <div class="notice section-gap"><strong>How it is calculated:</strong> ${isB ? 'Total weight = sum of bag weights. Gross sales = total weight × rate/kg. Labour salary = men × men’s wage + women × women’s wage. Net after costs = gross − operating expenses − labour salary.' : 'Gross income = quantity × rate/kg. Net after expenses = gross income − operating expenses.'} In monthly statements each expense item is counted on its own date.</div>`;
  }
  function recalcEntry() {
    if (!draft || activeView !== 'entry') return;
    const d = draft; const isB = d.product === 'brinjal';
    const kg = isB ? calc.bagKg(d.bagDetails) : num(d.kg);
    const gross = kg * num(d.ratePerKg); const exp = calc.expenseTotal(d.expenseItems);
    let labour = 0;
    if (isB) {
      const men = calc.menSubtotal(d), women = calc.womenSubtotal(d);
      labour = men + women + calc.legacySalary(d);
      $('#menSubtotal').textContent = `${int(d.menCount)} × ${money(num(d.menWage))} = ${money(men)}`;
      $('#womenSubtotal').textContent = `${int(d.womenCount)} × ${money(num(d.womenWage))} = ${money(women)}`;
      $('#calcKg').textContent = fmt(kg) + ' kg';
      $('#calcBags').textContent = `${d.bagDetails.length} bag${d.bagDetails.length === 1 ? '' : 's'}`;
      $('#calcLabour').textContent = money(labour);
    }
    const net = gross - exp - labour;
    $('#calcGross').textContent = money(gross); $('#calcExpenses').textContent = money(exp);
    $('#calcWastage').textContent = fmt(num(d.wastageKg)) + ' kg';
    const n = $('#calcNet'); n.textContent = money(net); n.classList.toggle('negative', r2(net) < 0);
  }
  function wireEntry() {
    const form = $('#entryForm'); if (!form) return;
    form.addEventListener('input', e => {
      const f = e.target.dataset && e.target.dataset.field; if (!f) return;
      draft[f] = e.target.dataset.int ? int(e.target.value) : e.target.value;
      e.target.removeAttribute('aria-invalid');
      draftDirty = true; recalcEntry();
    });
    form.addEventListener('change', e => {
      if (e.target.id === 'bagCount') { onBagCountChange(e.target); return; }
      const f = e.target.dataset && e.target.dataset.field; if (!f) return;
      draft[f] = e.target.dataset.int ? int(e.target.value) : e.target.value; draftDirty = true; recalcEntry();
    });

  }
  function markInvalid(el, msg) {

  }
  async function saveEntry() {
    const d = draft; const isB = d.product === 'brinjal';
    if (!isISODate(d.date)) return markInvalid($('#entryDate'), 'Please choose a valid date.');
    if (isB && !d.bagDetails.length) { showToast('Choose the number of bags and enter each bag’s details.', true); $('#bagCount').setAttribute('aria-invalid', 'true'); $('#bagCount').focus(); return; }
    if (!isB && parseNonNeg(d.kg) === null) return markInvalid($('#entryKg'), 'Quantity must be a number of kg (0 or more).');
    if (parseNonNeg(d.ratePerKg) === null) return markInvalid($('#entryRate'), 'Rate per kg must be a number (0 or more).');
    if (String(d.wastageKg ?? '').trim() !== '' && parseNonNeg(d.wastageKg) === null) return markInvalid($('#entryWastage'), 'Wastage must be a number of kg (0 or more), or left blank.');
    if (isB) {
      if (parseNonNeg(d.menWage) === null) return markInvalid($('#menWage'), "Men's wage must be a number (0 or more).");
      if (parseNonNeg(d.womenWage) === null) return markInvalid($('#womenWage'), "Women's wage must be a number (0 or more).");
    }
    const arr = dataset(d.product);
    const clash = arr.find(r => r.date === d.date && r.id !== d.id);
    if (clash && !(await ask(`A ${CFG[d.product].name} entry for ${dateLong(d.date)} already exists.\n\nReplace that entry with this one? (The other entry will be deleted.)`))) return;
    const now = nowISO();
    let rec = { id: d.id || uid(d.product === 'brinjal' ? 'b' : 'm'), date: d.date, ratePerKg: num(d.ratePerKg), wastageKg: num(d.wastageKg), expenseItems: clone(d.expenseItems), createdAt: d.createdAt || now, updatedAt: now };
    if (isB) rec = { ...rec, bagDetails: clone(d.bagDetails), menCount: int(d.menCount), womenCount: int(d.womenCount), menWage: num(d.menWage), womenWage: num(d.womenWage), legacyLabour: d.legacyLabour ? clone(d.legacyLabour) : null };
    else rec.kg = num(d.kg);
    const prev = clone(state.data[d.product]);
    let next = arr.filter(r => !(clash && r.id === clash.id));
    const idx = next.findIndex(r => r.id === rec.id);
    if (idx >= 0) next[idx] = rec; else next.push(rec);
    state.data[d.product] = next;
    if (!saveState()) { state.data[d.product] = prev; return; }
    draft = null; draftDirty = false; month = rec.date.slice(0, 7);
    showToast(d.id ? 'Changes saved.' : 'Daily entry saved.');
    go('records', { force: true });
  }

  /* --------------------------- Bag modal ---------------------------- */
  async function onBagCountChange(sel) {
    const n = int(sel.value); const cur = draft.bagDetails.length;
    sel.removeAttribute('aria-invalid');
    if (!n) {
      if (cur && (await ask(`Remove all ${cur} bags (${fmt(calc.bagKg(draft.bagDetails))} kg) from this draft?`))) { draft.bagDetails = []; draftDirty = true; refreshEntry(); }
      else sel.value = cur ? String(cur) : '';
      return;
    }
    if (n < cur) {
      const removed = draft.bagDetails.slice(n);
      const ok = (await ask(`Reduce from ${cur} to ${n} bags?\n\n${removed.length === 1 ? `Bag ${n + 1}` : `Bags ${n + 1}–${cur}`} (${fmt(calc.bagKg(removed))} kg) will be removed when you save the bag details. Bags 1–${n} keep their values.`));
      if (!ok) { sel.value = String(cur); return; }
    }
    openBagModal(n);
  }
  function resizeBags(items, n) {
    const out = clone(items).slice(0, n);
    const last = out[out.length - 1];
    while (out.length < n) out.push({ id: uid('bag'), weightKg: NEW_BAG_KG, brinjalType: last ? last.brinjalType : state.settings.brinjalTypes[0], size: last ? last.size : 'M' });

  }

    const items = resizeBags(draft.bagDetails, target);
    const original = JSON.stringify(resizeBags(draft.bagDetails, draft.bagDetails.length));
    modalCtx = { kind: 'bags', items, isDirty: () => JSON.stringify(modalCtx.items) !== original, onCancel: () => { const s = $('#bagCount'); if (s) s.value = draft.bagDetails.length ? String(draft.bagDetails.length) : ''; } };

    openModal(`<section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="bagModalTitle">
      <div class="modal-head"><div><div class="eyebrow">Brinjal · bag-by-bag record</div><h2 id="bagModalTitle" style="margin-top:4px">Enter details for ${items.length} bag${items.length === 1 ? '' : 's'}</h2><div class="muted small" style="margin-top:5px">Weight, type and size for every bag. New bags start at ${NEW_BAG_KG} kg — change it as needed.</div></div><button class="icon-btn" type="button" data-modal-close aria-label="Close">${icon('x')}</button></div>
      <div class="modal-body">${items.length > 1 ? `<div class="btn-row" style="margin-bottom:12px"><button type="button" class="btn small-btn soft" data-bag-copy>${icon('copy')} Use Bag 1 type & size for all bags</button></div>` : ''}${cards || '<div class="empty">No bags. Add one below.</div>'}
        <button type="button" class="btn soft" data-bag-add>${icon('plus')} Add another bag</button>
        <div class="notice" style="margin-top:14px"><strong>Total: <span id="modalBagTotal">${fmt(calc.bagKg(items))} kg</span> · ${items.length} bag${items.length === 1 ? '' : 's'}</strong><br><span class="small">Saving updates the daily-entry draft only. The day is saved when you press “Save daily entry”.</span></div></div>
      <div class="modal-foot"><button type="button" class="btn" data-modal-close>Cancel</button><button type="button" class="btn primary" id="saveBagModal">${icon('check')} Save bag details</button></div></section>`, focusSel || '#bagWeight0');

  function bagModalInput(e) {

  /* ------------------------- Expense modal -------------------------- */

      <div class="modal-head"><div><div class="eyebrow">${esc(CFG[draft.product].name)} · expense register</div><h2 id="expenseModalTitle" style="margin-top:4px">Expense details</h2><div class="muted small" style="margin-top:5px">Add each operating cost separately. Dates default to today; monthly reports use each expense’s own date.</div></div><button class="icon-btn" type="button" data-modal-close aria-label="Close">${icon('x')}</button></div>

  function saveExpenseModal() {

  /* ---------------------- In-app confirm dialog ----------------------
   * Replaces window.confirm(): native dialogs are blocked in sandboxed pages and look out of
   * place in the Android app. Returns a Promise<boolean>. The first paragraph is the title.
   */
  let askState = null;
  const askOpen = () => !!askState;
  function ask(message, opts = {}) {
    if (askState) askState.finish(false);
    return new Promise(resolve => {
      const [first, ...rest] = String(message).split('\n\n');
      const verb = opts.ok || (/^Delete/.test(first) ? 'Delete' : /^Remove/.test(first) ? 'Remove' : /^Restore/.test(first) ? 'Restore' : /^(Discard|You have unsaved|Clear)/.test(first) ? 'Discard' : /already exists/.test(first) ? 'Replace' : /^Reduce/.test(first) ? 'Reduce' : 'OK');
      const danger = opts.danger ?? ['Delete', 'Remove', 'Restore', 'Discard', 'Replace'].includes(verb);
      const prevFocus = document.activeElement;
      const root = $('#dialogRoot');
      root.innerHTML = `<div class="ask-layer" data-ask-backdrop><section class="ask-panel ${danger ? 'danger' : ''}" role="alertdialog" aria-modal="true" aria-labelledby="askTitle" aria-describedby="askBody">
        <div class="ask-emblem" aria-hidden="true">${icon(danger ? 'alert' : 'check')}</div>
        <h2 id="askTitle">${esc(first)}</h2>${rest.length ? `<p id="askBody">${esc(rest.join('\n\n'))}</p>` : '<p id="askBody"></p>'}
        <div class="ask-actions"><button type="button" class="btn" id="askCancel">${esc(opts.cancel || 'Cancel')}</button><button type="button" class="btn ${danger ? 'danger-solid' : 'primary'}" id="askOk">${esc(verb)}</button></div></section></div>`;
      document.body.classList.add('ask-open');
      const finish = val => {
        if (!askState) return;
        askState = null; root.innerHTML = ''; document.body.classList.remove('ask-open');
        if (prevFocus && document.body.contains(prevFocus)) prevFocus.focus({ preventScroll: true });
        resolve(val);
      };
      askState = { finish };
      $('#askOk').addEventListener('click', () => finish(true));
      $('#askCancel').addEventListener('click', () => finish(false));
      $('[data-ask-backdrop]').addEventListener('click', e => { if (e.target === e.currentTarget) finish(false); });
      (danger ? $('#askCancel') : $('#askOk')).focus({ preventScroll: true });
      window.dispatchEvent(new CustomEvent('fl-ask', { detail: { message: String(message) } }));
    });
  }

  /* -------------------------- Modal core ---------------------------- */
  function openModal(panelHtml, focusSel) {
    const root = $('#modalRoot');
    if (!root.firstChild) lastFocus = document.activeElement;
    // Replace the root node so old listeners are dropped on re-render.
    const fresh = root.cloneNode(false); root.replaceWith(fresh);
    fresh.innerHTML = `<div class="modal-layer" data-modal-backdrop>${panelHtml}</div>`;
    document.body.classList.add('modal-open');
    const target = (focusSel && $(focusSel, fresh)) || $('.modal-body input, .modal-body select, .modal-body button, .modal-foot button', fresh);
    if (target) target.focus({ preventScroll: true });
  }
  function closeModal() {
    const root = $('#modalRoot'); const fresh = root.cloneNode(false); root.replaceWith(fresh);
    document.body.classList.remove('modal-open'); modalCtx = null;
    if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus(); lastFocus = null;
  }
  async function requestCloseModal() {
    if (!modalCtx) { closeModal(); return; }
    if (modalCtx.isDirty && modalCtx.isDirty() && !(await ask('Discard the changes made in this window?\n\nValues already saved to the draft stay as they were.'))) return;
    if (modalCtx.onCancel) modalCtx.onCancel();
    closeModal();
  }
  const modalOpen = () => !!$('#modalRoot').firstChild;

  /* ------------------------------------------------------------------
   * Records
   * ------------------------------------------------------------------ */
  function recordsView() {
    return `<section class="card"><div class="card-head"><div><h2>${CFG[activeProduct].name} records</h2><div class="muted small">Every saved day, newest first. View, edit or delete.</div></div><button class="btn primary" type="button" data-nav="entry">${icon('plus')} Add entry</button></div>
      <div class="filter-row"><div class="field"><label for="recordsMonth">Month</label><input id="recordsMonth" type="month" value="${esc(recordsFilter.month)}"></div><div class="field"><label for="recordsSearch">Search</label><input id="recordsSearch" type="search" value="${esc(recordsFilter.q)}" placeholder="Date, brinjal type, expense purpose or notes"></div><button class="btn" type="button" data-action="records-clear">${icon('x')} Clear filters</button></div>
      <div id="recordsList">${recordsList()}</div></section>
      <div class="notice section-gap">The “Expenses” column shows the expense items attached to each daily record. Monthly statements group expenses by each item’s own date.</div>`;
  }
  function recordMatches(r, q) {
    if (!q) return true;
    const hay = [r.date, dateLabel(r.date), dateLong(r.date), ...(r.bagDetails || []).map(b => b.brinjalType + ' ' + b.size), ...(r.expenseItems || []).map(x => `${x.purpose} ${x.notes}`)].join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
  }
  function recordsList() {
    const all = sortedDesc();
    const rows = all.filter(r => (!recordsFilter.month || r.date.startsWith(recordsFilter.month)) && recordMatches(r, recordsFilter.q));
    if (!all.length) return emptyState(`No ${CFG[activeProduct].name.toLowerCase()} records yet.`, 'Use “Add entry” to record your first day.', activeProduct === 'brinjal' ? icon('bag') : melonSvg);
    if (!rows.length) return `<div class="empty"><div class="empty-icon">${icon('list')}</div><strong>No records match these filters.</strong><div class="small">Try another month or clear the search.</div><button class="btn" type="button" data-action="records-clear">Clear filters</button></div>`;
    const isB = activeProduct === 'brinjal';
    const actions = r => `<div class="btn-row"><button class="btn small-btn" type="button" data-action="view-record" data-id="${esc(r.id)}" aria-label="View ${esc(dateLabel(r.date))}">${icon('eye')} View</button><button class="btn small-btn" type="button" data-action="edit-record" data-id="${esc(r.id)}" aria-label="Edit ${esc(dateLabel(r.date))}">${icon('edit')} Edit</button><button class="btn small-btn danger" type="button" data-action="delete-record" data-id="${esc(r.id)}" aria-label="Delete ${esc(dateLabel(r.date))}">${icon('trash')}</button></div>`;
    const table = `<div class="table-wrap records-table"><table><thead><tr><th>Date</th>${isB ? '<th class="num">Bags</th>' : ''}<th class="num">${isB ? 'Weight' : 'Quantity'} (kg)</th><th class="num">Wastage (kg)</th><th class="num">Rate/kg</th><th class="num">${isB ? 'Gross sales' : 'Gross income'}</th><th class="num">Expenses</th>${isB ? '<th class="num">Men</th><th class="num">Women</th><th class="num">Labour salary</th>' : ''}<th class="num">Net</th><th>Actions</th></tr></thead><tbody>${rows.map(r => {
      const net = calc.recordNet(activeProduct, r);
      return `<tr data-record-row="${esc(r.id)}"><td><strong>${esc(dateLabel(r.date))}</strong> <span class="muted small">${esc(r.date.slice(0, 4))}</span>${r.sample ? ' <span class="tag">sample</span>' : ''}</td>${isB ? `<td class="num">${fmt(r.bagDetails.length)}</td>` : ''}<td class="num">${fmt(calc.kg(activeProduct, r))}</td><td class="num">${fmt(calc.wastage(r))}</td><td class="num">${money(r.ratePerKg)}</td><td class="num positive">${money(calc.gross(activeProduct, r))}</td><td class="num">${money(calc.expenseTotal(r.expenseItems))}</td>${isB ? `<td class="num">${fmt(r.menCount)}</td><td class="num">${fmt(r.womenCount)}${r.legacyLabour ? ` <span class="tag warn" title="Historical aggregate: men/women split unknown">+${fmt(r.legacyLabour.workers)} legacy</span>` : ''}</td><td class="num">${money(calc.labour(r))}</td>` : ''}<td class="num ${netCls(net)}">${money(net)}</td><td>${actions(r)}</td></tr>`;
    }).join('')}</tbody></table></div>`;
    const cards = `<div class="record-cards">${rows.map(r => {
      const net = calc.recordNet(activeProduct, r);
      return `<article class="record-card"><div class="record-card-head"><strong>${esc(dateLong(r.date))}</strong>${r.sample ? '<span class="tag">sample</span>' : ''}</div><dl>
        ${isB ? `<div><dt>Bags · weight</dt><dd>${fmt(r.bagDetails.length)} · ${fmt(calc.kg('brinjal', r))} kg</dd></div>` : `<div><dt>Quantity</dt><dd>${fmt(r.kg)} kg</dd></div>`}
        <div><dt>Wastage</dt><dd>${fmt(calc.wastage(r))} kg</dd></div><div><dt>Rate/kg</dt><dd>${money(r.ratePerKg)}</dd></div><div><dt>${isB ? 'Gross sales' : 'Gross income'}</dt><dd class="positive">${money(calc.gross(activeProduct, r))}</dd></div><div><dt>Expenses</dt><dd>${money(calc.expenseTotal(r.expenseItems))}</dd></div>
        ${isB ? `<div><dt>Labour</dt><dd>${money(calc.labour(r))}</dd></div>` : ''}<div><dt>Net</dt><dd class="${netCls(net)}">${money(net)}</dd></div></dl>${actions(r)}</article>`;
    }).join('')}</div>`;
    return `<div class="muted small" style="margin-bottom:8px">Showing ${rows.length} of ${all.length} record${all.length === 1 ? '' : 's'}</div>${table}${cards}`;

  function viewRecord(id) {

      <h3 style="margin:16px 0 8px">Labour</h3><div class="notice">Men: ${fmt(r.menCount)} × ${money(r.menWage)} = <strong>${money(calc.menSubtotal(r))}</strong><br>Women: ${fmt(r.womenCount)} × ${money(r.womenWage)} = <strong>${money(calc.womenSubtotal(r))}</strong>${r.legacyLabour ? `<br>Historical aggregate (split unknown): ${fmt(r.legacyLabour.workers)} workers = <strong>${money(r.legacyLabour.salary)}</strong>` : ''}<br>Total labour salary: <strong>${money(calc.labour(r))}</strong></div>` : '';

  async function startEdit(id) {
    const r = dataset().find(x => x.id === id); if (!r) return;
    if (!(await guardLeaveEntry())) return;
    if (modalOpen()) closeModal();
    draft = makeDraft(activeProduct, r); draftDirty = false;
    activeView = 'entry'; render(); pushHash(); scrollTop();
  }
  async function deleteRecord(id) {
    const r = dataset().find(x => x.id === id); if (!r) return;
    if (!(await ask(`Delete the ${CFG[activeProduct].name} entry for ${dateLong(r.date)}?\n\nThis cannot be undone unless you have a backup.`))) return;
    const prev = state.data[activeProduct];
    state.data[activeProduct] = prev.filter(x => x.id !== id);
    if (!saveState()) { state.data[activeProduct] = prev; return; }
    if (modalOpen()) closeModal();
    if (draft && draft.id === id) { draft = null; draftDirty = false; if (activeView === 'entry') activeView = 'records'; }
    render(); pushHash(); showToast('Entry deleted.');
  }

      : tile('Total quantity', fmt(t.kg) + ' kg') + tile('Wastage (not priced)', fmt(t.wastage) + ' kg') + tile('Gross income', money(t.gross), 'positive') + tile('Operating expenses', money(t.expenses), 'negative') + tile('Net after expenses', money(t.net), netCls(t.net));
    const body = st.rows.map(r => `<tr${r.kind === 'expense-only' ? ' class="muted"' : ''}>${cols.map(c => c.key === 'date' ? `<td><strong>${esc(dateLabel(r.date))}</strong>${r.kind === 'expense-only' ? ' <span class="tag warn">expenses only</span>' : ''}</td>` : `<td class="num ${c.key === 'net' ? netCls(r.net) : c.key === 'gross' && r.gross ? 'positive' : ''}">${cellText(c, r[c.key])}</td>`).join('')}</tr>`).join('');
    const foot = st.rows.length ? `<tfoot><tr>${cols.map(c => c.key === 'date' ? '<td>TOTAL</td>' : `<td class="num">${c.total ? cellText(c, t[c.key]) : '—'}</td>`).join('')}</tr></tfoot>` : '';
    const notes = [];
    if (isB && st.hasLegacy) notes.push('<strong>Legacy labour:</strong> some days come from the original sheet, which recorded only the total number of workers and total labour salary. Those workers are shown in a separate “split unknown” column and are not counted as men or women.');
    if (st.crossDated || st.hasExpenseOnly) notes.push(`<strong>Expense dates:</strong> expenses are counted on their own date. ${st.crossDated} expense item(s) in this month belong to a daily record dated differently${st.hasExpenseOnly ? '; dates marked “expenses only” have no sales record that day' : ''}.`);
    notes.push('<strong>Wastage:</strong> recorded in kg only. It has no price and is not included in gross sales or net.');

    const expTable = st.expenseItems.length ? `<h3 style="margin:18px 0 8px">Expense items · ${esc(monthLabel(month))}</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>What for?</th><th class="num">Amount</th><th>Notes</th><th>Daily record</th></tr></thead><tbody>${st.expenseItems.map(x => `<tr><td>${esc(dateLabel(x.date))}</td><td style="white-space:normal">${esc(x.purpose)}</td><td class="num">${money(x.amount)}</td><td style="white-space:normal">${esc(x.notes) || '—'}</td><td>${esc(dateLabel(x.recordDate))}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">Total</td><td class="num">${money(t.expenses)}</td><td colspan="2"></td></tr></tfoot></table></div>` : '';
    const p = state.profile;
    return `<div class="card-head no-print" style="margin-bottom:12px">${monthNav('reportMonth', 'Report month')}<div class="btn-row">${exportButtons(true)}</div></div>
      <section class="card" id="printArea"><div class="card-head"><div><div class="eyebrow">${esc(p.farmName || 'My Farm')} · monthly statement</div><h2 style="font-size:22px;margin:4px 0">${productIcon(activeProduct)} ${CFG[activeProduct].name} — ${esc(monthLabel(month))}</h2><div class="muted small">Prepared ${esc(new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }))}${p.ownerName ? ' · ' + esc(p.ownerName) : ''}${p.location ? ' · ' + esc(p.location) : ''} · ${t.records} daily record${t.records === 1 ? '' : 's'}</div></div></div>
        <div class="report-summary">${tiles}</div>
        <div class="table-wrap"><table id="reportTable"><thead><tr>${cols.map(c => `<th class="${c.key === 'date' ? '' : 'num'}">${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length}"><div class="empty"><div class="empty-icon">${icon('calendar')}</div><strong>No entries for ${esc(monthLabel(month))}.</strong><div class="small">Choose another month or add a daily entry.</div></div></td></tr>`}</tbody>${foot}</table></div>
        ${expTable}
        ${notes.map(n => `<div class="notice" style="margin-top:12px">${n}</div>`).join('')}
      </section>
      <section class="card section-gap no-print"><div class="card-head"><div><h2>Download this statement</h2><div class="muted small">${CFG[activeProduct].name} · ${esc(monthLabel(month))} · files are named ${esc(fileBase(activeProduct, month))}.*</div></div></div>
        <div class="quick-grid">${quick('data-action="export-pdf"', 'file', 'PDF', 'Print → “Save as PDF”')}${quick('data-action="export-xlsx"', 'table', 'Excel (.xlsx)', 'Statement + expense items')}${quick('data-action="export-png"', 'image', 'PNG image', 'Download or share to Gallery')}${quick('data-action="export-csv"', 'list', 'CSV', 'Plain data file')}</div>

    if (file.size > 20 * 1024 * 1024) { setImportStatus('<span class="negative">Import failed: file is larger than 20 MB.</span>'); showToast('Import failed: file too large.', true); return; }
    let parsed;
    try { parsed = JSON.parse(await file.text()); }
    catch (_) { setImportStatus(`<span class="negative">Import failed: “${esc(file.name)}” is not valid JSON. Nothing was changed.</span>`); showToast('Import failed: the file is not valid JSON. Nothing changed.', true); return; }
    const res = normalizeState(parsed, true);
    if (!res.state) {
      const list = res.problems.slice(0, 4).map(esc).join('<br>') + (res.problems.length > 4 ? `<br>…and ${res.problems.length - 4} more` : '');
      setImportStatus(`<span class="negative">Import failed — this is not a valid FieldLedger backup. Nothing was changed.</span><br>${list}`);
      showToast('Import failed: not a valid FieldLedger backup. Nothing changed.', true);
      return;
    }
    const nb = res.state.data.brinjal.length, nm = res.state.data.muskmelon.length;
    const when = parsed.exportedAt ? ` (exported ${new Date(parsed.exportedAt).toLocaleString('en-IN')})` : '';
    if (!(await ask(`Restore backup “${file.name}”${when}?\n\nIt contains ${nb} Brinjal and ${nm} Muskmelon records, plus settings and profile.\n\nThis REPLACES everything currently stored in this browser (${dataset('brinjal').length} Brinjal, ${dataset('muskmelon').length} Muskmelon records). Export a backup first if unsure.`))) {
      setImportStatus('Import cancelled. Nothing was changed.'); showToast('Import cancelled. Nothing changed.'); return;
    }
    const prev = state; state = res.state;
    if (!saveState()) { state = prev; return; }
    draft = null; draftDirty = false; startupNotice = '';
    importStatus = `<span class="positive">Backup restored: ${nb} Brinjal and ${nm} Muskmelon records.</span>`;
    render(); showToast('Backup restored successfully.');
  }

  /* ------------------------------------------------------------------
   * Navigation, routing and render
   * ------------------------------------------------------------------ */
  async function guardLeaveEntry() {
    if (activeView !== 'entry' || !draftDirty) return true;
    if (!(await ask('You have unsaved changes in this daily entry.\n\nLeave without saving? The draft will be discarded.'))) return false;
    draft = null; draftDirty = false; return true;
  }
  async function go(view, opts = {}) {
    if (!VIEWS.includes(view)) return false;
    if (!opts.force && view !== activeView && !(await guardLeaveEntry())) return false;
    if (modalOpen()) closeModal();
    if (view !== 'entry') { draft = null; draftDirty = false; }
    else if (activeView !== 'entry') { draft = null; draftDirty = false; }
    activeView = view; render();
    if (!opts.fromHistory) pushHash();
    scrollTop(); return true;
  }
  async function switchProduct(p) {
    if (!PRODUCTS.includes(p) || p === activeProduct) return;
    if (!(await guardLeaveEntry())) return;
    if (modalOpen()) closeModal();
    activeProduct = p; saveUI(); draft = null; draftDirty = false; recordsFilter = { month: '', q: '' };
    if (activeView === 'entry') activeView = 'dashboard';
    render(); pushHash();
  }
  const hashFor = () => `#/${activeProduct}/${activeView}`;
  function pushHash() { try { if (location.hash !== hashFor()) history.pushState(null, '', hashFor()); } catch (_) { /* sandboxed frame */ } }
  function readHash() { const m = /^#\/(brinjal|muskmelon)\/(\w+)$/.exec(location.hash); return m && VIEWS.includes(m[2]) ? { product: m[1], view: m[2] } : null; }
  window.addEventListener('popstate', async () => {
    if (askOpen()) { askState.finish(false); history.pushState(null, '', hashFor()); return; }
    if (modalOpen()) { if (modalCtx && modalCtx.isDirty && modalCtx.isDirty() && !(await ask('Discard the changes made in this window?'))) { history.pushState(null, '', hashFor()); return; } if (modalCtx && modalCtx.onCancel) modalCtx.onCancel(); closeModal(); }
    const h = readHash(); if (!h) return;
    if ((h.product !== activeProduct || h.view !== activeView) && !(await guardLeaveEntry())) { history.pushState(null, '', hashFor()); return; }
    if (h.product !== activeProduct) { activeProduct = h.product; saveUI(); recordsFilter = { month: '', q: '' }; draft = null; draftDirty = false; }
    if (h.view !== activeView) { draft = null; draftDirty = false; activeView = h.view; }
    render();
  });
  window.addEventListener('beforeunload', e => { if (activeView === 'entry' && draftDirty) { e.preventDefault(); e.returnValue = ''; } });

  function render() {
    renderShell();
    const views = { dashboard: dashboardView, entry: entryView, records: recordsView, reports: reportView, tools: toolsView, settings: settingsView, profile: profileView };
    $('#viewContainer').innerHTML = (views[activeView] || dashboardView)();
    if (activeView === 'entry') wireEntry();
  }

  /* ------------------------------------------------------------------
   * Events
   * ------------------------------------------------------------------ */
  function setMonth(v) {
    if (!isMonth(v)) { showToast('Choose a month in YYYY-MM format.', true); return; }
    month = v; render();
    const el = $('.month-input'); if (el) el.focus();
  }
  async function removeBrinjalType(type) {
    const list = state.settings.brinjalTypes;
    if (list.length <= 1) { showToast('Keep at least one brinjal type.', true); return; }
    let used = 0; dataset('brinjal').forEach(r => r.bagDetails.forEach(b => { if (b.brinjalType === type) used++; }));
    if (!(await ask(`Remove “${type}” from the brinjal type list?\n\n${used ? `${used} saved bag(s) use this type. They will KEEP the label “${type}” — it is only removed from the dropdown for new bags.` : 'No saved bags use this type.'}`))) return;
    state.settings.brinjalTypes = list.filter(t => t !== type);
    if (saveState()) { render(); showToast(`“${type}” removed from the list.`); }
  }
  async function handleAction(el) {
    const id = el.dataset.id;
    switch (el.dataset.action) {
      case 'month-prev': setMonth(addMonths(month, -1)); break;
      case 'month-next': setMonth(addMonths(month, 1)); break;
      case 'open-bags': openBagModal(); break;
      case 'open-expenses': openExpenseModal(); break;
      case 'legacy-remove': draft.removedLegacy = draft.legacyLabour; draft.legacyLabour = null; draftDirty = true; refreshEntry(); showToast('Historical labour amount will be removed when you save.'); break;
      case 'legacy-undo': draft.legacyLabour = draft.removedLegacy; draft.removedLegacy = null; refreshEntry(); break;
      case 'entry-cancel':
        if (draftDirty && !(await ask(draft.id ? 'Discard your changes to this entry?' : 'Clear this daily entry? Unsaved values will be lost.'))) return;
        if (draft.id) { draft = null; draftDirty = false; go('records', { force: true }); } else { draft = null; draftDirty = false; render(); }
        break;
      case 'entry-delete': deleteRecord(draft.id); break;
      case 'view-record': viewRecord(id); break;
      case 'edit-record': startEdit(id); break;
      case 'delete-record': deleteRecord(id); break;
      case 'records-clear': recordsFilter = { month: '', q: '' }; render(); break;
      case 'export-json': exportJSON(); break;
      case 'check-updates': if (NATIVE) { updateStatus = 'Checking for updates…'; const el = $('#updateStatus'); if (el) el.textContent = updateStatus; NATIVE.checkForUpdates(true); } break;
      case 'import-json': $('#importFile').value = ''; $('#importFile').click(); break;
      case 'export-csv': exportCSV(); break;
      case 'export-xlsx': exportXLSX(); break;
      case 'export-pdf': exportPDF(); break;
      case 'export-png': exportPNG(); break;
      case 'set-theme': state.settings.theme = el.dataset.value === 'dark' ? 'dark' : 'light'; saveState(); render(); showToast(`${state.settings.theme === 'dark' ? 'Dark' : 'Light'} theme on.`); break;
      case 'set-text': state.settings.textSize = el.dataset.value; saveState(); render(); showToast(`Text size: ${el.dataset.value}.`); break;
      case 'remove-type': removeBrinjalType(el.dataset.type); break;
      case 'reset-demo':
        if (!(await ask('Restore the October 2026 sample data?\n\nAll current Brinjal and Muskmelon records in this browser will be REPLACED. Settings and profile are kept.'))) return;
        { const prev = state.data; state.data = seedState().data; if (!saveState()) { state.data = prev; return; } }
        month = '2026-10'; draft = null; draftDirty = false; render(); showToast('Sample data restored.');
        break;
      default: break;
    }
  }
  document.addEventListener('click', e => {
    const t = e.target;
    // Modal-scoped controls first
    if (modalOpen() && t.closest('#modalRoot')) {
      if (t.closest('[data-modal-close]')) { requestCloseModal(); return; }
      if (t.matches('[data-modal-backdrop]')) { requestCloseModal(); return; }
      if (t.closest('#saveBagModal')) { saveBagModal(); return; }
      if (t.closest('#saveExpenseModal')) { saveExpenseModal(); return; }
      const addBag = t.closest('[data-bag-add]');
      if (addBag) { if (modalCtx.items.length >= MAX_BAGS * 2) return; modalCtx.items = resizeBags(modalCtx.items, modalCtx.items.length + 1); renderBagModal('#bagWeight' + (modalCtx.items.length - 1)); return; }
      const rmBag = t.closest('[data-bag-remove]');
      if (rmBag) { const i = Number(rmBag.dataset.bagRemove); modalCtx.items.splice(i, 1); renderBagModal(modalCtx.items.length ? '#bagWeight' + Math.max(0, i - 1) : '[data-bag-add]'); showToast(`Bag ${i + 1} removed from this list.`); return; }
      if (t.closest('[data-bag-copy]')) { const f = modalCtx.items[0]; modalCtx.items.forEach(b => { b.brinjalType = f.brinjalType; b.size = f.size; }); renderBagModal('[data-bag-copy]'); showToast('Bag 1 type and size applied to every bag.'); return; }
      if (t.closest('[data-exp-add]')) { modalCtx.items.push(blankExpense()); renderExpenseModal('#expensePurpose' + (modalCtx.items.length - 1)); return; }
      const rmExp = t.closest('[data-exp-remove]');
      if (rmExp) { const i = Number(rmExp.dataset.expRemove); modalCtx.items.splice(i, 1); renderExpenseModal(modalCtx.items.length ? '#expensePurpose' + Math.max(0, i - 1) : '[data-exp-add]'); return; }
    }
    const p = t.closest('[data-product-tab]'); if (p) { switchProduct(p.dataset.productTab); return; }
    const mr = t.closest('[data-month-report]'); if (mr) { if (isMonth(mr.dataset.monthReport)) month = mr.dataset.monthReport; go('reports'); return; }
    const n = t.closest('[data-nav]'); if (n) { if (n.dataset.nav === activeView && activeView !== 'entry') { scrollTop(); return; } if (n.dataset.nav === 'entry' && activeView === 'entry') { scrollTop(); return; } go(n.dataset.nav); return; }
    const a = t.closest('[data-action]'); if (a) { handleAction(a); }
  });
  document.addEventListener('keydown', e => {
    if (askOpen()) {
      if (e.key === 'Escape') { e.preventDefault(); askState.finish(false); return; }
      if (e.key === 'Tab') { e.preventDefault(); const a = $('#askOk'), c = $('#askCancel'); (document.activeElement === a ? c : a).focus(); }
      return;
    }
    if (!modalOpen()) return;
    if (e.key === 'Escape') { e.preventDefault(); requestCloseModal(); return; }
    if (e.key === 'Tab') {
      const f = $$('#modalRoot button, #modalRoot input, #modalRoot select, #modalRoot textarea').filter(x => !x.disabled && x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  $('#quickThemeBtn').addEventListener('click', () => { state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark'; saveState(); if (activeView === 'entry') renderShell(); else render(); });
  $('#quickTextBtn').addEventListener('click', () => { const cycle = { small: 'medium', medium: 'large', large: 'small' }; state.settings.textSize = cycle[state.settings.textSize]; saveState(); if (activeView === 'entry') renderShell(); else render(); showToast(`Text size: ${state.settings.textSize}.`); });
  $('#viewContainer').addEventListener('change', e => {
    if (e.target.classList.contains('month-input')) { if (e.target.value) setMonth(e.target.value); return; }
    if (e.target.id === 'recordsMonth') { recordsFilter.month = isMonth(e.target.value) ? e.target.value : ''; $('#recordsList').innerHTML = recordsList(); }
  });
  $('#viewContainer').addEventListener('input', e => {
    if (e.target.id === 'recordsSearch') { recordsFilter.q = e.target.value.slice(0, 80); $('#recordsList').innerHTML = recordsList(); }
  });
  $('#viewContainer').addEventListener('submit', e => {
    if (e.target.id === 'typeForm') {
      e.preventDefault();
      const input = $('#newBrinjalType'); const value = str(input.value, 50);
      if (!value) { input.setAttribute('aria-invalid', 'true'); input.focus(); showToast('Type a name for the brinjal type.', true); return; }
      if (state.settings.brinjalTypes.some(t => t.toLowerCase() === value.toLowerCase())) { input.setAttribute('aria-invalid', 'true'); showToast('That brinjal type already exists.', true); return; }
      state.settings.brinjalTypes.push(value);
      if (saveState()) { render(); $('#newBrinjalType').focus(); showToast(`“${value}” added — it now appears in the bag type dropdown.`); }
    }
    if (e.target.id === 'updateUrlForm' && NATIVE) {
      e.preventDefault();
      const msg = NATIVE.setUpdateUrl($('#updateUrl').value.trim());
      showToast(msg, /must|invalid/i.test(msg)); render();
      return;
    }
    if (e.target.id === 'profileForm') {
      e.preventDefault();
      const fd = new FormData(e.target);
      state.profile = normProfile({ farmName: fd.get('farmName'), ownerName: fd.get('ownerName'), phone: fd.get('phone'), location: fd.get('location') });
      if (saveState()) { render(); showToast('Profile saved.'); }
    }
  });
  $('#importFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; handleImportFile(f); });
  window.addEventListener('afterprint', () => document.body.classList.remove('printing-report'));

  /* 3D tilt for cards on devices with a precise pointer (skipped for touch and reduced motion). */
  if (window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    let tiltEl = null;
    document.addEventListener('pointermove', e => {
      if (prefersReducedMotion()) return;
      const el = e.target.closest && e.target.closest('.tilt');
      if (tiltEl && tiltEl !== el) { tiltEl.classList.remove('tilting'); tiltEl.style.removeProperty('--tilt-x'); tiltEl.style.removeProperty('--tilt-y'); tiltEl = null; }
      if (!el) return;
      const r = el.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width - .5; const py = (e.clientY - r.top) / r.height - .5;
      el.style.setProperty('--tilt-x', (-py * 9).toFixed(2) + 'deg'); el.style.setProperty('--tilt-y', (px * 11).toFixed(2) + 'deg');
      el.classList.add('tilting'); tiltEl = el;
    }, { passive: true });
    document.addEventListener('pointerleave', () => { if (tiltEl) { tiltEl.classList.remove('tilting'); tiltEl.style.removeProperty('--tilt-x'); tiltEl.style.removeProperty('--tilt-y'); tiltEl = null; } });
  }

  /* ------------------------------------------------------------------
   * Boot
   * ------------------------------------------------------------------ */
  const initial = readHash();
  if (initial) { activeProduct = initial.product; activeView = initial.view; }
  if (!lsGet(STORAGE_KEY) && storageOK) saveState();
  render();
  try { history.replaceState(null, '', hashFor()); } catch (_) { /* sandboxed frame */ }
  if (HOSTED() && !NATIVE) document.body.classList.add('hosted');
  if (startupNotice) showToast(startupNotice);
  // Exposed for automated tests and debugging (read-only helpers; no network access anywhere).
  window.FieldLedger = Object.freeze({ calc, buildStatement, normalizeState, getState: () => clone(state), version: '2.0.0' });
})();
</script>
