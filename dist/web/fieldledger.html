<title>FieldLedger Farm Ledger</title>
<meta name="theme-color" content="#6d45d9">
<style>
  :root {
    --bg: #f5f5fb; --surface: #ffffff; --surface-2: #f8f7fc; --text: #201d2b; --muted: #6c6880;
    --line: #e8e5ef; --primary: #7248df; --primary-2: #a18af4; --primary-soft: #f0eaff; --on-primary: #ffffff;
    --positive: #13804f; --negative: #c93f3f; --labour: #8b50c7; --warn-bg: #fff6df; --warn-line: #f0d48a; --warn-text: #7a5600;
    --shadow: 0 12px 36px rgba(35, 24, 76, .08);
    --radius: 22px; --fs: 1;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size:calc(14px * var(--fs)); line-height: 1.45; transition: background .2s, color .2s; overflow-x: hidden; }
  body[data-product="muskmelon"] { --primary: #b07a06; --primary-2: #f1c24f; --primary-soft: #fff3cf; }
  body[data-theme="dark"] { --bg: #111018; --surface: #1c1a26; --surface-2: #242130; --text: #f2effb; --muted: #aaa5bb; --line: #353142; --primary: #a68bff; --primary-2: #7a5ae6; --primary-soft: #302745; --positive: #4fd39a; --negative: #ff7b7b; --labour: #c79bff; --warn-bg: #3a3020; --warn-line: #6b5426; --warn-text: #f4d58d; --shadow: 0 12px 36px rgba(0,0,0,.22); }
  body[data-theme="dark"][data-product="muskmelon"] { --primary: #f3c044; --primary-2: #c48c10; --primary-soft: #3a2f17; }
  body.text-small { --fs: .9; font-size:calc(12.6px * var(--fs)); } body.text-large { --fs: 1.15; font-size:calc(16px * var(--fs)); }
  body.modal-open { overflow: hidden; }
  button, input, select, textarea { font: inherit; } button { cursor: pointer; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 60%, transparent); outline-offset: 2px; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .ico { width:1.2em; height:1.2em; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.22em; }
  .app-shell { max-width: 1440px; margin: auto; padding: 18px clamp(12px, 2.5vw, 34px) 38px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px; }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .brand-mark { width:48px; height:48px; border-radius:17px; display:grid; place-items:center; font-size:calc(25px * var(--fs)); background:linear-gradient(145deg,var(--primary-2),var(--primary)); box-shadow:inset 0 2px 2px #ffffff99, 0 7px 13px color-mix(in srgb, var(--primary) 25%, transparent); transform:rotate(-3deg); flex:none; }
  .brand-title { font-size:calc(18px * var(--fs)); font-weight:850; letter-spacing:-.5px; line-height:1.15; }
  .brand-sub { color:var(--muted); font-size:calc(12px * var(--fs)); margin-top:4px; }
  .top-actions { display:flex; align-items:center; gap:8px; }
  .icon-btn, .profile-chip { border:1px solid var(--line); color:var(--text); background:var(--surface); border-radius:14px; min-height:44px; padding:0 12px; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 3px 9px rgba(25,20,50,.025); }
  .icon-btn { width:44px; font-size:calc(16px * var(--fs)); padding:0; font-weight:800; flex:none; }
  .profile-chip { font-weight:700; max-width:220px; }
  .profile-chip .profile-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .avatar { width:25px; height:25px; display:grid; place-items:center; border-radius:9px; color:white; background:linear-gradient(145deg,var(--primary-2),var(--primary)); font-size:calc(12px * var(--fs)); flex:none; }
  .product-switch { display:flex; align-items:center; gap:8px; padding:6px; width:max-content; max-width:100%; border-radius:18px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); margin-bottom:16px; }
  .product-tab { display:flex; align-items:center; gap:9px; border:0; color:var(--muted); background:transparent; padding:10px 17px; min-height:48px; border-radius:13px; font-weight:800; white-space:nowrap; }
  .product-tab .mini-icon { width:30px; height:30px; display:grid; place-items:center; font-size:calc(17px * var(--fs)); border-radius:10px; background:var(--surface-2); box-shadow:inset 0 1px #ffffff66; }
  .product-tab.active { color:var(--primary); background:var(--primary-soft); box-shadow:inset 0 1px 0 #ffffff8c; }
  .product-tab .tamil { color:var(--muted); font-weight:600; }
  .context-row { display:flex; justify-content:space-between; align-items:end; gap:12px; margin:16px 2px 18px; }
  .eyebrow { color:var(--primary); text-transform:uppercase; font-weight:850; letter-spacing:1.5px; font-size:calc(10px * var(--fs)); }
  h1 { margin:3px 0 0; font-size:clamp(25px,3.3vw,34px); letter-spacing:-1.1px; line-height:1.12; }
  h2 { margin:0; font-size:calc(17px * var(--fs)); letter-spacing:-.35px; } h3 { margin:0; font-size:calc(14px * var(--fs)); }
  p { margin:0; } .muted { color:var(--muted); } .small { font-size:calc(12px * var(--fs)); } .mono { font-variant-numeric:tabular-nums; }
  .context-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { border:1px solid var(--line); color:var(--text); background:var(--surface); border-radius:13px; padding:10px 14px; min-height:44px; font-weight:750; display:inline-flex; align-items:center; justify-content:center; gap:7px; transition:transform .15s, box-shadow .15s, background .15s; }
  .btn:hover { transform:translateY(-1px); box-shadow:0 7px 18px rgba(30,20,60,.08); }
  .btn.primary { background:linear-gradient(135deg,var(--primary-2),var(--primary)); color:var(--on-primary); border-color:transparent; box-shadow:0 6px 14px color-mix(in srgb, var(--primary) 23%, transparent), inset 0 1px 0 #ffffff75; }
  body[data-product="muskmelon"] .btn.primary { color:#2b1d00; }
  body[data-theme="dark"] .btn.primary { color:#140f22; }
  .btn.soft { color:var(--primary); background:var(--primary-soft); border-color:transparent; }
  .btn.danger { color:var(--negative); background:color-mix(in srgb, var(--negative) 8%, var(--surface)); }
  .btn.small-btn { padding:7px 10px; min-height:36px; border-radius:10px; font-size:calc(12px * var(--fs)); }
  .btn-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .nav { display:flex; gap:5px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; margin:0 0 20px; }
  .nav::-webkit-scrollbar { display:none; }
  .nav-btn { border:0; background:transparent; color:var(--muted); border-bottom:3px solid transparent; padding:12px 15px 13px; white-space:nowrap; font-weight:750; display:flex; align-items:center; gap:8px; }
  .nav-btn.active { border-bottom-color:var(--primary); color:var(--primary); }
  .view { min-height:330px; }
  .grid { display:grid; gap:15px; } .grid.kpis { grid-template-columns:repeat(4,minmax(0,1fr)); } .grid.kpis.six { grid-template-columns:repeat(3,minmax(0,1fr)); } .grid.kpis.five { grid-template-columns:repeat(5,minmax(0,1fr)); }
  .grid.two { grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr); }
  .grid.equal { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .card { min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
  .card-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:15px; flex-wrap:wrap; }
  .kpi { position:relative; overflow:hidden; padding:17px; }
  .kpi::after { content:""; position:absolute; width:95px; height:95px; border-radius:50%; right:-40px; bottom:-45px; background:var(--primary-soft); opacity:.9; }
  .kpi-top { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); font-weight:700; font-size:calc(12px * var(--fs)); position:relative; z-index:1; }
  .kpi-icon { width:36px; height:36px; border-radius:13px; display:grid; place-items:center; flex:none; font-size:calc(18px * var(--fs)); color:var(--primary); background:var(--primary-soft); box-shadow:inset 0 1px 1px #ffffff8c, 0 4px 8px color-mix(in srgb, var(--primary) 10%, transparent); }
  .kpi-value { font-size:clamp(20px,2.1vw,28px); font-weight:850; letter-spacing:-.8px; margin-top:15px; position:relative; z-index:1; overflow-wrap:anywhere; }
  .kpi-note { margin-top:3px; color:var(--muted); font-size:calc(11px * var(--fs)); position:relative; z-index:1; }
  .kpi.sale .kpi-value { color:var(--positive); } .kpi.expense .kpi-value { color:var(--negative); } .kpi.labour .kpi-value { color:var(--labour); }
  .section-gap { margin-top:16px; }
  .quick-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
  .quick-grid.cols-2 { grid-template-columns:repeat(2,minmax(0,1fr)); } .quick-grid.cols-1 { grid-template-columns:1fr; }
  .quick-card { text-align:left; display:flex; align-items:center; gap:11px; min-height:72px; padding:14px; border:1px solid var(--line); border-radius:17px; background:var(--surface-2); color:var(--text); min-width:0; transition:transform .15s, border-color .15s; }
  .quick-card:hover { border-color:var(--primary-2); transform:translateY(-1px); }
  .quick-icon { flex-shrink:0; height:42px; width:42px; display:grid; place-items:center; border-radius:14px; font-size:calc(19px * var(--fs)); color:var(--primary); background:linear-gradient(145deg,var(--primary-soft),var(--surface)); box-shadow:inset 0 1px #ffffffa6, 0 5px 10px rgba(25,20,50,.05); }
  .quick-card strong { display:block; font-size:calc(12px * var(--fs)); } .quick-card span > span { color:var(--muted); font-size:calc(11px * var(--fs)); display:block; margin-top:3px; }
  .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:14px; max-width:100%; }
  table { width:100%; border-collapse:separate; border-spacing:0; min-width:650px; font-size:calc(12px * var(--fs)); }
  thead th { background:var(--surface-2); color:var(--muted); text-align:left; text-transform:uppercase; letter-spacing:.65px; font-size:calc(10px * var(--fs)); padding:12px 13px; white-space:nowrap; border-bottom:1px solid var(--line); }
  tbody td { padding:12px 13px; border-bottom:1px solid var(--line); white-space:nowrap; } tbody tr:last-child td { border-bottom:0; }
  tbody tr:hover { background:color-mix(in srgb,var(--primary-soft) 34%,transparent); }
  tfoot td { background:var(--surface-2); padding:12px 13px; font-weight:850; border-top:1px solid var(--line); white-space:nowrap; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }

  .tag.warn { color:var(--warn-text); background:var(--warn-bg); }
  .positive { color:var(--positive); font-weight:800; } .negative { color:var(--negative); font-weight:800; }
  .chart { height:190px; display:flex; align-items:end; gap:6px; padding:18px 4px 0; border-bottom:1px solid var(--line); }
  .bar-col { flex:1; height:100%; display:flex; flex-direction:column; justify-content:end; align-items:center; min-width:0; gap:6px; }
  .bar { width:min(100%,40px); min-height:4px; border-radius:10px 10px 3px 3px; background:linear-gradient(180deg,var(--primary-2),var(--primary)); box-shadow:inset 0 1px #ffffff85; }
  .bar-label { font-size:calc(10px * var(--fs)); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .bar-value { font-size:calc(9px * var(--fs)); color:var(--muted); white-space:nowrap; }
  .chart .empty { flex:1; align-self:center; }
  .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px; }
  .form-grid.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .field { display:flex; flex-direction:column; gap:7px; min-width:0; }
  .field.full { grid-column:1/-1; }
  .field label, .field-label { color:var(--muted); font-size:calc(12px * var(--fs)); font-weight:750; }
  input, select, textarea { width:100%; color:var(--text); background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:11px 13px; outline:none; min-height:46px; }
  input:focus, select:focus, textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent); }
  input[aria-invalid="true"], select[aria-invalid="true"] { border-color:var(--negative); box-shadow:0 0 0 3px color-mix(in srgb,var(--negative) 15%,transparent); }
  .field-hint { color:var(--muted); font-size:calc(11px * var(--fs)); margin-top:-2px; }
  .form-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:18px; padding-top:17px; border-top:1px solid var(--line); }
  .calc-strip { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); align-items:stretch; gap:10px; margin-top:18px; }
  .calc-strip.three-col { grid-template-columns:repeat(3,minmax(0,1fr)); } .calc-strip.four-col { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .calc-strip.six { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .calc-item.wastage strong { color:var(--muted); }
  .calc-item { min-width:0; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:0 5px 16px rgba(35,24,76,.045); }
  .calc-item span { display:block; color:var(--muted); font-size:calc(11px * var(--fs)); font-weight:750; }
  .calc-item strong { font-size:clamp(16px,1.7vw,21px); display:block; margin-top:6px; color:var(--primary); overflow-wrap:anywhere; }
  .calc-item small { display:block; color:var(--muted); font-size:calc(10px * var(--fs)); margin-top:3px; }
  .calc-item.sale strong { color:var(--positive); } .calc-item.expense strong { color:var(--negative); } .calc-item.labour strong { color:var(--labour); } .calc-item.net strong.negative { color:var(--negative); }
  .detail-edit { width:100%; text-align:left; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; min-height:56px; color:var(--text); background:var(--surface-2); border:1px solid var(--line); border-radius:13px; transition:border-color .2s,transform .2s; }
  .detail-edit:hover { border-color:var(--primary-2); transform:translateY(-1px); }
  .detail-edit strong { color:var(--primary); }
  .bag-preview { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .bag-chip { display:inline-flex; align-items:center; gap:5px; padding:5px 8px; border:1px solid var(--line); border-radius:9px; color:var(--muted); background:var(--surface); font-size:calc(11px * var(--fs)); }
  .form-section { padding-top:18px; margin-top:18px; border-top:1px dashed var(--line); }
  .form-section:first-of-type { border-top:0; margin-top:0; padding-top:0; }
  .section-title { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .section-title h3 { display:flex; align-items:center; gap:8px; }
  .labour-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .labour-card { border:1px solid var(--line); border-radius:16px; padding:13px; background:var(--surface-2); display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .labour-card .labour-title { grid-column:1/-1; font-weight:850; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .labour-card .subtotal { color:var(--labour); font-weight:800; }
  .legacy-box { margin-top:12px; border:1px solid var(--warn-line); background:var(--warn-bg); color:var(--warn-text); border-radius:14px; padding:12px 14px; font-size:calc(12px * var(--fs)); display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap; }
  .modal-layer { position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:18px; background:rgba(17,14,28,.56); backdrop-filter:blur(8px); animation:fadeIn .18s ease both; }
  .modal-panel { width:min(760px,100%); max-height:min(90dvh,920px); display:flex; flex-direction:column; background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:24px; box-shadow:0 28px 90px rgba(0,0,0,.28); animation:modalIn .24s cubic-bezier(.2,.8,.2,1) both; overflow:hidden; }
  .modal-head { flex:none; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:18px 20px; background:var(--surface); border-bottom:1px solid var(--line); }
  .modal-body { flex:1 1 auto; min-height:0; overflow:auto; overscroll-behavior:contain; padding:18px 20px; }
  .modal-foot { flex:none; display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 20px; background:var(--surface); border-top:1px solid var(--line); flex-wrap:wrap; }
  .bag-entry-card, .expense-entry-card { padding:14px; margin-bottom:11px; border:1px solid var(--line); border-radius:17px; background:var(--surface-2); }
  .entry-card-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
  .entry-card-title { display:flex; align-items:center; gap:9px; font-weight:850; }
  .entry-card-number { display:grid; place-items:center; width:30px; height:30px; border-radius:10px; color:var(--primary); background:var(--primary-soft); box-shadow:inset 0 1px #ffffff90; }
  .melon-svg { display:inline-block; width:1.3em; height:1.3em; vertical-align:-.25em; flex:none; }
  .type-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .type-pill { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:12px; padding:4px 4px 4px 11px; background:var(--surface-2); }
  .type-pill button { border:0; background:transparent; color:var(--negative); min-width:36px; min-height:36px; border-radius:9px; display:grid; place-items:center; }
  .type-pill button:hover { background:color-mix(in srgb,var(--negative) 10%,transparent); }
  .month-nav { display:flex; align-items:center; gap:6px; }
  .month-nav input { width:auto; min-width:0; max-width:190px; text-align:center; font-weight:750; }
  .month-hero { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .month-hero .big { font-size:clamp(28px,4vw,40px); font-weight:850; letter-spacing:-1.2px; margin-top:4px; }
  @keyframes fadeIn { from {opacity:0} to {opacity:1} }
  @keyframes modalIn { from {opacity:0; transform:translateY(14px) scale(.985)} to {opacity:1; transform:translateY(0) scale(1)} }
  @keyframes viewEnter { from {opacity:0; transform:translateY(6px)} to {opacity:1; transform:translateY(0)} }
  .view > * { animation:viewEnter .22s ease both; }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important; } }
  .filter-row { display:grid; grid-template-columns:200px minmax(0,1fr) auto; align-items:end; gap:10px; margin-bottom:14px; }
  .report-summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:16px; }
  .report-tile { padding:13px 14px; border-radius:15px; background:var(--surface-2); border:1px solid var(--line); min-width:0; }
  .report-tile span { display:block; color:var(--muted); font-size:calc(11px * var(--fs)); font-weight:700; } .report-tile strong { display:block; font-size:calc(18px * var(--fs)); margin-top:5px; letter-spacing:-.5px; overflow-wrap:anywhere; }
  .notice { border-radius:14px; padding:12px 14px; color:var(--muted); background:var(--surface-2); border:1px solid var(--line); font-size:calc(12px * var(--fs)); }
  .notice strong { color:var(--text); }
  .notice.warn { background:var(--warn-bg); border-color:var(--warn-line); color:var(--warn-text); }
  .notice.warn strong { color:inherit; }
  .settings-layout { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
  .setting-choice { display:flex; flex-wrap:wrap; gap:8px; }
  .choice { border:1px solid var(--line); border-radius:12px; padding:10px 14px; min-height:44px; color:var(--muted); font-weight:750; background:var(--surface-2); display:inline-flex; align-items:center; gap:7px; }
  .choice.active { background:var(--primary-soft); color:var(--primary); border-color:color-mix(in srgb,var(--primary) 30%,var(--line)); }
  .profile-hero { display:flex; align-items:center; gap:15px; margin-bottom:18px; }
  .profile-big { width:68px; height:68px; border-radius:23px; display:grid; place-items:center; font-size:calc(28px * var(--fs)); font-weight:850; color:#fff; background:linear-gradient(145deg,var(--primary-2),var(--primary)); box-shadow:inset 0 2px #ffffff8a, 0 10px 20px color-mix(in srgb,var(--primary) 18%,transparent); flex:none; }
  .empty { text-align:center; padding:30px 16px; color:var(--muted); white-space:normal; }
  .empty .empty-icon { font-size:calc(30px * var(--fs)); margin-bottom:8px; color:var(--primary); }
  .empty .btn { margin-top:12px; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px); background:#24202f; color:#fff; border-radius:13px; padding:12px 17px; box-shadow:0 12px 35px #0003; z-index:300; opacity:0; pointer-events:none; transition:.22s; max-width:min(520px, calc(100vw - 28px)); text-align:center; }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  /* ===================== 3D depth layer (v2.1) ===================== */
  :root { --hl: rgba(255,255,255,.85); --ink-shadow: 30, 20, 70; --tilt-x: 0deg; --tilt-y: 0deg; }
  body[data-theme="dark"] { --hl: rgba(255,255,255,.10); --ink-shadow: 0, 0, 0; }
  body { background:
      radial-gradient(1100px 620px at 8% -12%, color-mix(in srgb, var(--primary) 16%, transparent), transparent 62%),
      radial-gradient(900px 520px at 108% 4%, color-mix(in srgb, var(--primary-2) 18%, transparent), transparent 60%),
      radial-gradient(700px 500px at 50% 115%, color-mix(in srgb, var(--primary) 9%, transparent), transparent 70%),
      var(--bg);
    background-attachment: fixed; }
  .card { border-color: color-mix(in srgb, var(--line) 75%, transparent);
    background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 96%, var(--primary-soft)) 0%, var(--surface) 38%);
    box-shadow: inset 0 1px 0 var(--hl), 0 1px 2px rgba(var(--ink-shadow), .05), 0 6px 14px rgba(var(--ink-shadow), .06), 0 22px 44px -12px rgba(var(--ink-shadow), .16); }

  .tilt .kpi-value, .tilt .quick-icon, .tilt .kpi-icon { transform: translateZ(26px); }
  .kpi::after { background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--primary-2) 45%, var(--primary-soft)), var(--primary-soft) 70%); opacity: .75; }
  .kpi-icon, .quick-icon, .entry-card-number, .avatar {
    background: radial-gradient(circle at 30% 22%, var(--hl) 0, color-mix(in srgb, var(--primary-soft) 80%, white) 32%, color-mix(in srgb, var(--primary) 30%, var(--primary-soft)) 100%);
    box-shadow: inset 0 -3px 6px color-mix(in srgb, var(--primary) 22%, transparent), inset 0 2px 2px var(--hl), 0 6px 12px -2px color-mix(in srgb, var(--primary) 30%, transparent); }
  .avatar { color:#fff; background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.55), var(--primary-2) 35%, var(--primary) 100%); }
  .brand-mark { box-shadow: inset 0 2px 2px rgba(255,255,255,.6), inset 0 -4px 8px rgba(0,0,0,.18), 0 3px 0 color-mix(in srgb, var(--primary) 70%, black), 0 12px 22px color-mix(in srgb, var(--primary) 35%, transparent); }
  /* Raised, pressable buttons */
  .btn { box-shadow: inset 0 1px 0 var(--hl), 0 3px 0 color-mix(in srgb, var(--line) 90%, rgba(var(--ink-shadow), .25)), 0 6px 14px -6px rgba(var(--ink-shadow), .18); transition: transform .12s, box-shadow .12s, background .15s; }

  .btn:active { box-shadow: inset 0 1px 0 var(--hl), 0 1px 0 color-mix(in srgb, var(--line) 90%, rgba(var(--ink-shadow), .25)); }
  .btn.primary { box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 0 rgba(0,0,0,.12), 0 4px 0 color-mix(in srgb, var(--primary) 62%, black), 0 12px 22px -6px color-mix(in srgb, var(--primary) 55%, transparent); }
  .btn.primary:active { box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 1px 0 color-mix(in srgb, var(--primary) 62%, black), 0 4px 10px -4px color-mix(in srgb, var(--primary) 45%, transparent); }
  .btn.danger-solid { color:#fff; border-color:transparent; background: linear-gradient(135deg, #e25b5b, #c13a3a); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 0 #8f2626, 0 12px 22px -6px rgba(193,58,58,.5); }
  .btn.danger-solid:active { box-shadow: 0 1px 0 #8f2626; }
  .icon-btn, .profile-chip { box-shadow: inset 0 1px 0 var(--hl), 0 3px 0 color-mix(in srgb, var(--line) 90%, rgba(var(--ink-shadow), .25)), 0 8px 16px -8px rgba(var(--ink-shadow), .25); }
  .icon-btn:active, .profile-chip:active { transform: translateY(2px); box-shadow: inset 0 1px 0 var(--hl), 0 1px 0 var(--line); }
  .quick-card { background: linear-gradient(160deg, var(--surface) 0%, var(--surface-2) 100%); box-shadow: inset 0 1px 0 var(--hl), 0 3px 0 color-mix(in srgb, var(--line) 85%, transparent), 0 10px 20px -12px rgba(var(--ink-shadow), .3); }
  /* Segmented product switch with a raised active pill */
  .product-switch { background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); box-shadow: inset 0 2px 5px rgba(var(--ink-shadow), .08), inset 0 -1px 0 var(--hl), 0 10px 26px -14px rgba(var(--ink-shadow), .35); }
  .product-tab.active { background: linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--primary-soft) 70%, var(--surface))); box-shadow: inset 0 1px 0 var(--hl), 0 3px 0 color-mix(in srgb, var(--primary) 30%, var(--line)), 0 10px 18px -8px color-mix(in srgb, var(--primary) 45%, transparent); }
  .product-tab .mini-icon { box-shadow: inset 0 1px 1px var(--hl), 0 3px 6px -2px rgba(var(--ink-shadow), .25); background: radial-gradient(circle at 30% 25%, var(--hl), var(--surface-2) 60%); }

  .detail-edit { box-shadow: inset 0 1px 0 var(--hl), 0 3px 0 color-mix(in srgb, var(--line) 85%, transparent); }
  .labour-card, .bag-entry-card, .expense-entry-card, .record-card { box-shadow: inset 0 1px 0 var(--hl), 0 8px 18px -14px rgba(var(--ink-shadow), .35); }
  /* 3D product emblem beside the page title */
  .title-wrap { display:flex; align-items:center; gap:14px; }
  .emblem { width:54px; height:54px; flex:none; perspective:400px; }
  .emblem-coin { width:100%; height:100%; border-radius:18px; display:grid; place-items:center; font-size:28px; transform-style:preserve-3d; transform: rotateY(-14deg) rotateX(8deg);
    background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.9), var(--primary-soft) 38%, color-mix(in srgb, var(--primary) 40%, var(--primary-soft)) 100%);
    box-shadow: inset 0 2px 2px rgba(255,255,255,.8), inset 0 -5px 10px color-mix(in srgb, var(--primary) 30%, transparent), 4px 6px 0 color-mix(in srgb, var(--primary) 45%, var(--line)), 0 16px 24px -8px color-mix(in srgb, var(--primary) 50%, transparent);
    animation: emblemIn .9s cubic-bezier(.2,.8,.2,1) both; }
  .emblem-coin .melon-svg { width:34px; height:34px; }
  @keyframes emblemIn { from { transform: rotateY(-200deg) rotateX(8deg) scale(.7); opacity:0 } to { transform: rotateY(-14deg) rotateX(8deg) scale(1); opacity:1 } }
  /* Floating bottom nav active pill (mobile) and sheet handle */
  .nav-btn.active .ico { filter: drop-shadow(0 3px 4px color-mix(in srgb, var(--primary) 45%, transparent)); }
  /* In-app confirm dialog */
  .ask-layer { position:fixed; inset:0; z-index:400; display:grid; place-items:center; padding:20px; background:rgba(17,14,28,.5); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); animation:fadeIn .15s ease both; }
  .ask-panel { width:min(440px,100%); background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:24px; padding:22px; text-align:center; box-shadow: inset 0 1px 0 var(--hl), 0 30px 80px rgba(0,0,0,.35); animation:askIn .22s cubic-bezier(.2,.8,.2,1) both; }
  .ask-panel h2 { font-size:calc(18px * var(--fs)); margin:12px 0 6px; }
  .ask-panel p { color:var(--muted); white-space:pre-line; margin:0 0 18px; font-size:calc(13px * var(--fs)); }
  .ask-emblem { width:56px; height:56px; margin:0 auto; border-radius:18px; display:grid; place-items:center; font-size:26px; color:var(--primary); background: radial-gradient(circle at 30% 22%, var(--hl), var(--primary-soft) 45%, color-mix(in srgb, var(--primary) 30%, var(--primary-soft))); box-shadow: inset 0 -3px 6px color-mix(in srgb, var(--primary) 25%, transparent), 0 10px 18px -6px color-mix(in srgb, var(--primary) 45%, transparent); }
  .ask-panel.danger .ask-emblem { color:#c13a3a; background: radial-gradient(circle at 30% 22%, var(--hl), #ffe3e3 45%, #f6b4b4); box-shadow: inset 0 -3px 6px rgba(193,58,58,.25), 0 10px 18px -6px rgba(193,58,58,.4); }
  .ask-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @keyframes askIn { from { opacity:0; transform: perspective(700px) rotateX(-14deg) translateY(16px) scale(.96) } to { opacity:1; transform:none } }
  body.ask-open { overflow:hidden; }
  details summary { cursor:pointer; }
  body.hosted [data-action="export-pdf"] { display:none !important; }
  body[data-theme="dark"] { color-scheme: dark; } body[data-theme="light"] { color-scheme: light; }

  /* ===================== v2.2: glass, compact shell, transitions ===================== */
  :root { --glass: rgba(255,255,255,.55); --glass-strong: rgba(255,255,255,.72); --glass-line: rgba(255,255,255,.75); --glass-shadow: 0 8px 24px -10px rgba(40,24,90,.28); }
  body[data-theme="dark"] { --glass: rgba(40,36,56,.55); --glass-strong: rgba(48,43,66,.75); --glass-line: rgba(255,255,255,.12); --glass-shadow: 0 8px 24px -10px rgba(0,0,0,.6); }
  .btn, .icon-btn, .account-chip, .choice, .quick-card, .detail-edit {
    background: var(--glass); border: 1px solid var(--glass-line);
    -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), var(--glass-shadow); }
  body[data-theme="dark"] .btn, body[data-theme="dark"] .icon-btn, body[data-theme="dark"] .account-chip, body[data-theme="dark"] .choice, body[data-theme="dark"] .quick-card, body[data-theme="dark"] .detail-edit { box-shadow: inset 0 1px 0 rgba(255,255,255,.08), var(--glass-shadow); }
  /* Hover: plain glass buttons lighten; coloured buttons keep their colour and only brighten. */
  .btn:not(.primary):not(.danger-solid):not(.danger):not(.soft):hover, .icon-btn:hover, .quick-card:hover { background: var(--glass-strong); }
  .btn.primary:hover, .btn.danger-solid:hover { filter: brightness(1.07) saturate(1.05); }
  .btn.danger:hover { background: color-mix(in srgb, var(--negative) 16%, var(--glass)); }
  .btn.soft:hover { background: var(--primary-soft); }
  .btn:active, .icon-btn:active, .account-chip:active { transform: translateY(1px) scale(.98) !important; box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 3px 10px -6px rgba(40,24,90,.3); }
  .btn.primary { color:#fff; border-color: rgba(255,255,255,.35);
    background: linear-gradient(135deg, color-mix(in srgb, var(--primary-2) 78%, transparent), color-mix(in srgb, var(--primary) 88%, transparent));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 10px 26px -10px color-mix(in srgb, var(--primary) 70%, transparent); }
  body[data-product="muskmelon"] .btn.primary { color:#2b1d00; }
  .btn.primary:active { box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 12px -6px color-mix(in srgb, var(--primary) 60%, transparent); }
  .btn.danger { color: var(--negative); background: color-mix(in srgb, var(--negative) 10%, var(--glass)); }
  .btn.soft { color: var(--primary); background: color-mix(in srgb, var(--primary-soft) 70%, transparent); }
  .btn.icon-only { width:44px; min-width:44px; padding:0; font-size:20px; font-weight:800; }
  .btn.wide { width:100%; }
  .choice.active { background: color-mix(in srgb, var(--primary-soft) 80%, transparent); border-color: color-mix(in srgb, var(--primary) 35%, transparent); }
  .link-btn { border:0; background:none; color:var(--primary); font-weight:750; padding:0; text-decoration:underline; min-height:0; }
  /* Compact top bar: brand · product switch · theme · account */
  .topbar { gap:10px; margin-bottom:16px; }
  .top-actions { gap:8px; min-width:0; }
  .brand-mark { position:relative; overflow:hidden; font-size:0; transform:none; }
  .brand-mark .bm-a, .brand-mark .bm-b { position:absolute; display:block; }
  .brand-mark .bm-a { left:4px; top:5px; } .brand-mark .bm-b { right:3px; bottom:3px; }
  .brand-mark .melon-svg { width:28px; height:28px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.2)); }
  .brand-mark.big { width:72px; height:72px; border-radius:24px; margin:0 auto; }
  .brand-mark.big .melon-svg { width:42px; height:42px; }
  .product-switch { margin:0; width:auto; padding:4px; gap:4px; border-radius:16px; background: var(--glass); border:1px solid var(--glass-line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .product-tab { min-height:40px; padding:6px 12px 6px 6px; gap:6px; font-size:calc(13px * var(--fs)); border-radius:12px; }
  .product-tab .mini-icon { width:28px; height:28px; border-radius:9px; }
  .product-tab .melon-svg { width:22px; height:22px; }
  .account-chip { position:relative; width:44px; min-height:44px; border-radius:14px; display:grid; place-items:center; padding:0; color:var(--text); }
  .account-chip .avatar { width:28px; height:28px; border-radius:10px; font-weight:800; }
  .status-dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#9a95ab; flex:none; box-shadow:0 0 0 2px var(--surface); }
  .account-chip .status-dot { position:absolute; right:4px; top:4px; }
  .status-dot.green { background:#1fbf6a; box-shadow:0 0 0 2px var(--surface), 0 0 8px #1fbf6a; }
  .status-dot.orange { background:#f39a1f; box-shadow:0 0 0 2px var(--surface), 0 0 8px #f39a1f; }

  @keyframes dotPulse { 50% { transform: scale(.75); opacity:.7 } }

  .legend { display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:16px; color:var(--muted); font-size:calc(12px * var(--fs)); }
  .legend > span { display:inline-flex; align-items:center; gap:6px; }
  .modal-panel.narrow { width:min(480px,100%); }
  /* Daily entry header with tap-to-change date */
  .entry-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .date-pill { position:relative; display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:8px 12px; border-radius:14px; font-weight:800; color:var(--primary); background: color-mix(in srgb, var(--primary-soft) 75%, transparent); border:1px solid color-mix(in srgb, var(--primary) 25%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); cursor:pointer; }
  .date-pill .pill-chev { width:1em; height:1em; opacity:.7; }

  /* Sign-in screen */
  body.login-mode .nav, body.login-mode .product-toggle, body.login-mode .account-chip, body.login-mode .footer { display:none !important; }
  .login-card { max-width:440px; margin:4vh auto 0; display:grid; gap:14px; }

  .login-brand { text-align:center; display:grid; gap:6px; }

  .otp-input { text-align:center; font-size:calc(26px * var(--fs)); font-weight:800; letter-spacing:.5em; font-variant-numeric:tabular-nums; }
  .login-links { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .login-divider { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:calc(12px * var(--fs)); }
  .login-divider::before, .login-divider::after { content:""; flex:1; height:1px; background:var(--line); }
  /* Smooth screen and theme transitions (View Transitions API; no-op elsewhere) */
  .topbar { view-transition-name: fl-topbar; } .nav { view-transition-name: fl-nav; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration:.32s; animation-timing-function:cubic-bezier(.2,.8,.2,1); }
  html[data-vt="forward"]::view-transition-old(root) { animation-name: vtOutLeft; }
  html[data-vt="forward"]::view-transition-new(root) { animation-name: vtInRight; }
  html[data-vt="back"]::view-transition-old(root) { animation-name: vtOutRight; }
  html[data-vt="back"]::view-transition-new(root) { animation-name: vtInLeft; }
  html[data-vt="product"]::view-transition-new(root) { animation-name: vtZoomIn; }
  html[data-vt="theme"]::view-transition-old(root) { animation:none; }
  html[data-vt="theme"]::view-transition-new(root) { animation: vtReveal .55s cubic-bezier(.3,.7,.2,1) both; }
  @keyframes vtOutLeft { to { opacity:0; transform: translateX(-28px); } }
  @keyframes vtInRight { from { opacity:0; transform: translateX(28px); } }
  @keyframes vtOutRight { to { opacity:0; transform: translateX(28px); } }
  @keyframes vtInLeft { from { opacity:0; transform: translateX(-28px); } }
  @keyframes vtZoomIn { from { opacity:0; transform: scale(.985); } }
  @keyframes vtReveal { from { clip-path: circle(0 at var(--vt-x, 90%) var(--vt-y, 40px)); } to { clip-path: circle(150% at var(--vt-x, 90%) var(--vt-y, 40px)); } }
  body, .card, .btn, .icon-btn, input, select, .nav { transition: background-color .35s ease, color .35s ease, border-color .35s ease; }

  /* ===================== v2.4: product switch, brand, spinners, layout polish ===================== */

  .top-actions { flex:none; display:flex; align-items:center; gap:8px; }
  .topbar .top-actions { flex:none; width:auto; justify-content:flex-end; }
  .product-toggle { position:relative; flex:none; width:78px; height:44px; padding:0; border-radius:999px; cursor:pointer; color:var(--text);
    background: var(--glass); border:1px solid var(--glass-line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), var(--glass-shadow); }
  .pt-track { position:absolute; inset:4px; border-radius:999px; background: color-mix(in srgb, var(--primary-soft) 85%, transparent); box-shadow: inset 0 2px 4px rgba(var(--ink-shadow), .12); transition: background-color .35s; }

  /**

  function recalcEntry() {

    let type = '';
    if (isB) {

    state.data[d.product] = next;
    let newType = false;
    if (isB) {
      // Most recently used type first; a new custom type is added to the Settings list.
      const ix = state.settings.brinjalTypes.findIndex(t => t.toLowerCase() === type.toLowerCase());
      newType = ix < 0;
      const list = state.settings.brinjalTypes.filter((_, i) => i !== ix);
      state.settings.brinjalTypes = [ix >= 0 ? prevTypes[ix] : type, ...list];
      if (ix >= 0) rec.brinjalType = prevTypes[ix];
    }
    if (!saveState()) { state.data[d.product] = prev; state.settings.brinjalTypes = prevTypes; return; }
    cloud.queueEntry(d.product, rec.id);
    if (clash) cloud.queueEntry(d.product, clash.id, true);
    if (isB) cloud.queueSettings();
    draft = null; draftDirty = false; month = rec.date.slice(0, 7);
    showToast(`${d.id ? 'Changes saved.' : 'Entry saved.'}${newType ? ` “${type}” added to your types.` : ''}`);
    go('records', { force: true });
  }

  /* --------------------------- Bag modal ---------------------------- */
  async function onBagCountChange(input) {
    const raw = String(input.value).trim(); const cur = draft.bagDetails.length;
    input.removeAttribute('aria-invalid');
    if (raw !== '' && (!/^\d+$/.test(raw) || Number(raw) > MAX_BAGS)) { input.value = cur || ''; markInvalid(input, `Enter a whole number of bags (1–${MAX_BAGS}).`); return; }
    const n = raw === '' ? 0 : Number(raw);
    if (n === cur) { if (n) openBagModal(n); return; }
    if (!n) {
      if (cur && (await ask(`Remove all ${cur} bags (${fmt(calc.bagKg(draft.bagDetails))} kg) from this draft?`))) { draft.bagDetails = []; draftDirty = true; refreshEntry(); }
      else input.value = cur || '';
      return;
    }
    if (n < cur) {
      const removed = draft.bagDetails.slice(n);
      const ok = (await ask(`Reduce from ${cur} to ${n} bags?\n\n${removed.length === 1 ? `Bag ${n + 1}` : `Bags ${n + 1}–${cur}`} (${fmt(calc.bagKg(removed))} kg) will be removed when you save the bag weights. Bags 1–${n} keep their values.`));
      if (!ok) { input.value = String(cur); return; }
    }
    openBagModal(n);
  }
  function resizeBags(items, n) {
    const out = clone(items).slice(0, n);
    const last = out[out.length - 1];
    while (out.length < n) out.push({ id: uid('bag'), weightKg: NEW_BAG_KG, size: last ? last.size : 'M' });
    return out.map(b => ({ id: b.id, weightKg: String(b.weightKg), size: SIZES[b.size] ? b.size : 'M' }));
  }
  function openBagModal(n) {
    const target = n || draft.bagDetails.length;
    if (!target) { markInvalid($('#bagCount'), 'Enter the number of bags first.'); return; }
    const items = resizeBags(draft.bagDetails, target);
    const original = JSON.stringify(resizeBags(draft.bagDetails, draft.bagDetails.length));
    modalCtx = { kind: 'bags', items, isDirty: () => JSON.stringify(modalCtx.items) !== original, onCancel: () => { const s = $('#bagCount'); if (s) s.value = draft.bagDetails.length || ''; } };

  }
  function renderBagModal(focusSel) {
    const items = modalCtx.items;
    const cards = items.map((b, i) => `<section class="bag-entry-card" aria-labelledby="bagTitle${i}"><div class="bag-row"><div class="entry-card-title" id="bagTitle${i}"><span class="entry-card-number">${i + 1}</span><span class="sr-only">Bag ${i + 1}</span></div>
      <div class="field"><label for="bagWeight${i}">Weight (kg)</label><input id="bagWeight${i}" type="number" inputmode="decimal" min="0" step="0.01" data-bag="${i}" data-key="weightKg" value="${esc(b.weightKg)}" required></div>
      <div class="field"><label for="bagSize${i}">Size</label><select id="bagSize${i}" data-bag="${i}" data-key="size">${Object.entries(SIZES).map(([k, v]) => `<option value="${k}" ${b.size === k ? 'selected' : ''}>${k} · ${v}</option>`).join('')}</select></div>

      <div class="modal-head"><div><h2 id="bagModalTitle">${items.length} bag${items.length === 1 ? '' : 's'} · <span id="modalBagTotal">${fmt(calc.bagKg(items))} kg</span></h2><div class="muted small" style="margin-top:4px">${esc(draft.typeMode === 'custom' ? (draft.customType || 'New type') : draft.brinjalType)} · new bags start at ${NEW_BAG_KG} kg</div></div><button class="icon-btn" type="button" data-modal-close aria-label="Close">${icon('x')}</button></div>
      <div class="modal-body">${items.length > 1 ? `<div class="btn-row" style="margin-bottom:12px"><button type="button" class="btn small-btn soft" data-bag-copy>${icon('copy')} Same size as Bag 1 for all</button></div>` : ''}${cards || '<div class="empty">No bags. Add one below.</div>'}

  function saveExpenseModal() {
    const items = modalCtx.items;
    const kept = [];
    for (let i = 0; i < items.length; i++) {
      const x = items[i];
      const blank = !str(x.purpose) && String(x.amount ?? '').trim() === '' && !str(x.notes);

  /* ---------------------- In-app confirm dialog ----------------------
   * Replaces window.confirm(): native dialogs are blocked in sandboxed pages and look out of
   * place in the Android app. Returns a Promise<boolean>. The first paragraph is the title.
   */
  let askState = null;
  const askOpen = () => !!askState;
  function ask(message, opts = {}) {
    if (askState) askState.finish(false);
    return new Promise(resolve => {
      const [first, ...rest] = String(message).split('\n\n');
      const verb = opts.ok || (/^Delete/.test(first) ? 'Delete' : /^Remove/.test(first) ? 'Remove' : /^Restore/.test(first) ? 'Restore' : /^(Discard|You have unsaved|Clear)/.test(first) ? 'Discard' : /already exists/.test(first) ? 'Replace' : /^Reduce/.test(first) ? 'Reduce' : 'OK');
      const danger = opts.danger ?? ['Delete', 'Remove', 'Restore', 'Discard', 'Replace'].includes(verb);
      const prevFocus = document.activeElement;
      const root = $('#dialogRoot');
      root.innerHTML = `<div class="ask-layer" data-ask-backdrop><section class="ask-panel ${danger ? 'danger' : ''}" role="alertdialog" aria-modal="true" aria-labelledby="askTitle" aria-describedby="askBody">
        <div class="ask-emblem" aria-hidden="true">${icon(danger ? 'alert' : 'check')}</div>
        <h2 id="askTitle">${esc(first)}</h2>${rest.length ? `<p id="askBody">${esc(rest.join('\n\n'))}</p>` : '<p id="askBody"></p>'}
        <div class="ask-actions"><button type="button" class="btn" id="askCancel">${esc(opts.cancel || 'Cancel')}</button><button type="button" class="btn ${danger ? 'danger-solid' : 'primary'}" id="askOk">${esc(verb)}</button></div></section></div>`;
      document.body.classList.add('ask-open');
      const finish = val => {
        if (!askState) return;
        askState = null; root.innerHTML = ''; document.body.classList.remove('ask-open');
        if (prevFocus && document.body.contains(prevFocus)) prevFocus.focus({ preventScroll: true });
        resolve(val);
      };
      askState = { finish };
      $('#askOk').addEventListener('click', () => finish(true));
      $('#askCancel').addEventListener('click', () => finish(false));
      $('[data-ask-backdrop]').addEventListener('click', e => { if (e.target === e.currentTarget) finish(false); });
      (danger ? $('#askCancel') : $('#askOk')).focus({ preventScroll: true });
      window.dispatchEvent(new CustomEvent('fl-ask', { detail: { message: String(message) } }));
    });
  }

  /* -------------------------- Modal core ---------------------------- */
  function openModal(panelHtml, focusSel) {
    const root = $('#modalRoot');

    const fresh = root.cloneNode(false); root.replaceWith(fresh);
    fresh.innerHTML = `<div class="modal-layer" data-modal-backdrop>${panelHtml}</div>`;
    document.body.classList.add('modal-open');
    const target = (focusSel && $(focusSel, fresh)) || $('.modal-body input, .modal-body select, .modal-body button, .modal-foot button', fresh);
    if (target) target.focus({ preventScroll: true });
  }
  function closeModal() {
    const root = $('#modalRoot'); const fresh = root.cloneNode(false); root.replaceWith(fresh);
    document.body.classList.remove('modal-open'); modalCtx = null;

  }

  /* ------------------------------------------------------------------
   * Exports
   * ------------------------------------------------------------------ */
  function downloadBlob(blob, filename) {
    if (NATIVE) {
      // WebView cannot follow blob: downloads, so hand the bytes to the Android shell.
      const reader = new FileReader();
      reader.onload = () => {
        try { const msg = NATIVE.saveFile(filename, blob.type || 'application/octet-stream', String(reader.result).split(',')[1] || ''); showToast(msg || `Saved ${filename}.`, /^Could not/.test(msg || '')); }
        catch (e) { showToast(`Could not save ${filename}.`, true); }
      };
      reader.onerror = () => showToast(`Could not read ${filename}.`, true);
      reader.readAsDataURL(blob);
      return;
    }
    if (HOSTED()) {
      getHostDownloads().then(dl => {
        if (!dl) { showToast('Downloads are not available in this view. Open FieldLedger in a browser or the Android app to export.', true); return; }
        dl.save({ filename, data: blob }).then(() => showToast(`${filename} saved.`)).catch(err => {
          const code = err && err.code;
          if (code === 'declined') showToast('Download cancelled.');
          else if (code === 'rate_limited') showToast('Another download is waiting for your answer — try again in a moment.', true);
          else showToast(`Could not save ${filename} here (${code || 'unavailable'}).`, true);
        });
      });
      return;
    }
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  /** Rows of plain values for CSV/XLSX: header, data rows, TOTAL row. */
  function statementMatrix(st) {
    const cols = statementColumns(st);
    const out = [cols.map(c => c.label)];
    st.rows.forEach(r => out.push(cols.map(c => c.key === 'date' ? r.date : (r[c.key] == null ? '' : c.type === 'text' ? r[c.key] : r2(r[c.key])))));
    out.push(cols.map(c => c.key === 'date' ? 'TOTAL' : (c.total ? r2(st.totals[c.key]) : '')));
    return { cols, rows: out };
  }
  function exportCSV() {
    const st = buildStatement(activeProduct, month);
    const { rows } = statementMatrix(st);
    const csv = rows.map(row => row.map(v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
    downloadBlob(new Blob(['﻿', csv], { type: 'text/csv;charset=utf-8' }), fileBase(activeProduct, month) + '.csv');
    showToast(`CSV downloaded · ${st.rows.length} row(s).`);
  }
  const xmlEsc = v => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  function colName(n) { let s = ''; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; }
  const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(bytes) { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  const le16 = v => [v & 255, (v >>> 8) & 255]; const le32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  /** Minimal ZIP writer (stored, no compression) — enough for a valid .xlsx package. */
  function zipStore(files, type) {
    const enc = new TextEncoder(); const parts = []; const central = []; let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name); const data = enc.encode(f.data); const crc = crc32(data);
      const header = new Uint8Array([...le32(0x04034b50), ...le16(20), ...le16(0x0800), ...le16(0), ...le16(0), ...le16(0x21), ...le32(crc), ...le32(data.length), ...le32(data.length), ...le16(name.length), ...le16(0), ...name]);
      parts.push(header, data);
      central.push(new Uint8Array([...le32(0x02014b50), ...le16(20), ...le16(20), ...le16(0x0800), ...le16(0), ...le16(0), ...le16(0x21), ...le32(crc), ...le32(data.length), ...le32(data.length), ...le16(name.length), ...le16(0), ...le16(0), ...le16(0), ...le16(0), ...le32(0), ...le32(offset), ...name]));
      offset += header.length + data.length;
    }
    const csize = central.reduce((s, a) => s + a.length, 0);
    const end = new Uint8Array([...le32(0x06054b50), ...le16(0), ...le16(0), ...le16(files.length), ...le16(files.length), ...le32(csize), ...le32(offset), ...le16(0)]);
    return new Blob([...parts, ...central, end], { type });
  }
  // Cell styles: 0 normal, 1 bold, 2 money #,##0.00, 3 bold money, 4 integer #,##0, 5 bold integer, 6 title
  function sheetXml(rowsSpec, widths, freezeRow) {
    const xmlRows = rowsSpec.map((cells, ri) => `<row r="${ri + 1}">${cells.map((c, ci) => {
      if (c == null || c.v === '' || c.v == null) return c && c.s ? `<c r="${colName(ci + 1)}${ri + 1}" s="${c.s}"/>` : '';
      const ref = colName(ci + 1) + (ri + 1);
      if (typeof c.v === 'number' && Number.isFinite(c.v)) return `<c r="${ref}" s="${c.s || 0}"><v>${c.v}</v></c>`;
      return `<c r="${ref}" s="${c.s || 0}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(c.v)}</t></is></c>`;
    }).join('')}</row>`).join('');
    const pane = freezeRow ? `<sheetViews><sheetView workbookViewId="0"><pane ySplit="${freezeRow}" topLeftCell="A${freezeRow + 1}" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>` : '';

    }
    const p = t.closest('[data-product-tab]'); if (p) { switchProduct(p.dataset.productTab); return; }
    const mr = t.closest('[data-month-report]'); if (mr) { if (isMonth(mr.dataset.monthReport)) month = mr.dataset.monthReport; go('reports'); return; }
    const n = t.closest('[data-nav]'); if (n) { if (n.dataset.nav === activeView && activeView !== 'entry') { scrollTop(); return; } if (n.dataset.nav === 'entry' && activeView === 'entry') { scrollTop(); return; } go(n.dataset.nav); return; }
    const a = t.closest('[data-action]'); if (a) { handleAction(a); }
  });
  document.addEventListener('keydown', e => {
    if (askOpen()) {
      if (e.key === 'Escape') { e.preventDefault(); askState.finish(false); return; }
      if (e.key === 'Tab') { e.preventDefault(); const a = $('#askOk'), c = $('#askCancel'); (document.activeElement === a ? c : a).focus(); }
      return;
    }
    if (!modalOpen()) return;
    if (e.key === 'Escape') { e.preventDefault(); requestCloseModal(); return; }
    if (e.key === 'Tab') {
      const f = $$('#modalRoot button, #modalRoot input, #modalRoot select, #modalRoot textarea').filter(x => !x.disabled && x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  $('#quickThemeBtn').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    document.documentElement.style.setProperty('--vt-x', Math.round(r.left + r.width / 2) + 'px');
    document.documentElement.style.setProperty('--vt-y', Math.round(r.top + r.height / 2) + 'px');
    withTransition(() => { state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark'; saveState(); if (activeView === 'entry') renderShell(); else render(); }, 'theme');
  });
  $('#viewContainer').addEventListener('change', e => {
    if (e.target.classList.contains('month-input')) { if (e.target.value) setMonth(e.target.value); return; }
    if (e.target.id === 'recordsMonth') { recordsFilter.month = isMonth(e.target.value) ? e.target.value : ''; $('#recordsList').innerHTML = recordsList(); }
  });
  $('#viewContainer').addEventListener('input', e => {
    if (e.target.id === 'otpCode') { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); if (e.target.value.length === 6) verifyCode(); return; }
    if (e.target.id === 'recordsSearch') { recordsFilter.q = e.target.value.slice(0, 80); $('#recordsList').innerHTML = recordsList(); }
  });
  $('#viewContainer').addEventListener('submit', e => {
    if (e.target.id === 'typeForm') {
      e.preventDefault();
      const input = $('#newBrinjalType'); const value = str(input.value, 50);
      if (!value) { input.setAttribute('aria-invalid', 'true'); input.focus(); showToast('Type a name for the brinjal type.', true); return; }
      if (state.settings.brinjalTypes.some(t => t.toLowerCase() === value.toLowerCase())) { input.setAttribute('aria-invalid', 'true'); showToast('That brinjal type already exists.', true); return; }
      state.settings.brinjalTypes.unshift(value);
      if (saveState()) { cloud.queueSettings(); render(); $('#newBrinjalType').focus(); showToast(`“${value}” added to the type list.`); }
    }
    if (e.target.id === 'wagesForm') {
      e.preventDefault();
      const next = {};
      for (const p of PRODUCTS) for (const g of ['men', 'women']) {
        const el = $(`#wage-${p}-${g}`); const v = parseNonNeg(el.value);
        if (v === null) return markInvalid(el, 'Wages must be numbers (0 or more).');
        (next[p] = next[p] || {})[g] = v;
      }
      state.settings.wages = next;
      if (saveState()) { cloud.queueSettings(); render(); showToast('Default wages saved. New entries will use them.'); }
    }
    if (e.target.id === 'cloudSetupForm') {
      e.preventDefault();
      try { cloud.setServer($('#cloudUrl').value, $('#cloudKey').value); render(); showToast('Connected. Now sign in or create an account.'); }
      catch (err) { setLoginStatus(err.message, true); }
      return;
    }
    if (e.target.id === 'loginForm') {
      e.preventDefault();
      const email = str($('#loginEmail').value, 200).toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return markInvalid($('#loginEmail'), 'Enter a valid email address.');
      sendCode(email); return;
    }
    if (e.target.id === 'otpForm') { e.preventDefault(); verifyCode(); return; }
    if (e.target.id === 'updateUrlForm' && NATIVE) {
      e.preventDefault();
      const msg = NATIVE.setUpdateUrl($('#updateUrl').value.trim());
      showToast(msg, /must|invalid/i.test(msg)); render();
      return;
    }
    if (e.target.id === 'profileForm') {
      e.preventDefault();
      const fd = new FormData(e.target);
      state.profile = normProfile({ farmName: fd.get('farmName'), ownerName: fd.get('ownerName'), phone: fd.get('phone'), location: fd.get('location') });
      if (saveState()) { cloud.queueSettings(); render(); showToast('Profile saved.'); }
    }
  });
  $('#importFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; handleImportFile(f); });
  window.addEventListener('afterprint', () => document.body.classList.remove('printing-report'));

  /* 3D tilt for cards on devices with a precise pointer (skipped for touch and reduced motion). */
  if (window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    let tiltEl = null;
    document.addEventListener('pointermove', e => {
      if (prefersReducedMotion()) return;
      const el = e.target.closest && e.target.closest('.tilt');
      if (tiltEl && tiltEl !== el) { tiltEl.classList.remove('tilting'); tiltEl.style.removeProperty('--tilt-x'); tiltEl.style.removeProperty('--tilt-y'); tiltEl = null; }
      if (!el) return;
      const r = el.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width - .5; const py = (e.clientY - r.top) / r.height - .5;
      el.style.setProperty('--tilt-x', (-py * 9).toFixed(2) + 'deg'); el.style.setProperty('--tilt-y', (px * 11).toFixed(2) + 'deg');
      el.classList.add('tilting'); tiltEl = el;
    }, { passive: true });
    document.addEventListener('pointerleave', () => { if (tiltEl) { tiltEl.classList.remove('tilting'); tiltEl.style.removeProperty('--tilt-x'); tiltEl.style.removeProperty('--tilt-y'); tiltEl = null; } });
  }

  /* ------------------------------------------------------------------
   * Boot
   * ------------------------------------------------------------------ */
  if (authLink) {
    try { history.replaceState(null, '', location.pathname); } catch (_) { /* ignore */ }
    if (cloud.configured()) cloud.adoptLink(authLink).then(() => { showToast('Signed in from the email link.'); render(); }).catch(e => showToast(e.message, true));
  }
  document.body.insertAdjacentHTML('afterbegin', i3dDefs());
  const initial = readHash();
  if (initial) { activeProduct = initial.product; activeView = initial.view; }
  if (!lsGet(STORAGE_KEY) && storageOK) saveState();
  render();
  try { history.replaceState(null, '', hashFor()); } catch (_) { /* sandboxed frame */ }
  if (HOSTED() && !NATIVE) document.body.classList.add('hosted');
  if (startupNotice) showToast(startupNotice);
  // Exposed for automated tests and debugging (read-only helpers; no network access anywhere).
  window.FieldLedger = Object.freeze({ calc, buildStatement, normalizeState, getState: () => clone(state), version: '2.0.0' });
})();
</script>
